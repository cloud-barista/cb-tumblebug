tumblebug:
  # CB-Tumblebug API endpoint
  endpoint: http://localhost:1323

  # Namespace used for all test operations
  nsId: default

# Multi-CSP test cases for batch testing the RDBMS lifecycle:
# vNet+subnets -> securityGroup -> rdbms/support -> RDBMS create -> get -> list
# -> database create -> database list -> dummy data write/read/verify/delete
# -> database delete -> RDBMS delete -> securityGroup delete -> subnets delete
# -> vNet delete
#
# Copy this file to test-config.yaml and adjust values for your environment.
# Set 'execute: true' for the CSPs you want to include in the test run.
#
# autoFillDefaults: true fills dbEngineVersion/dbSpec/storageType/storageSize
# from GET /tumblebug/rdbms/support (first supported option) — see
# docs/feature_guide/rdbms-management.md. Leave the four fields blank when using it.
#
# CSPs verified for RDBMS (mysql) per docs/feature_guide/rdbms-management.md's
# CSP Capability Summary (MySQL) section: aws, azure, gcp, alibaba, tencent, ibm,
# openstack, ncp, nhn
#
# databaseName: logical database created/listed/deleted inside the RDBMS instance
# (defaults to "sampledb" if left blank).
#
# Password policy quirks (see rdbms-management.md's Admin Credential Constraints section):
# - IBM: rejects special characters (e.g. !, @) in adminUserPassword
# - NCP: requires a special character in adminUserPassword
testCases:
  - rdbmsId: test-rdbms-aws
    connectionName: aws-ap-northeast-2
    vNetName: test-rdbms-vnet-aws
    cidrBlock: 10.0.0.0/16
    # AWS requires 2 subnets in distinct AZs (SubnetGroup requirement) and a SecurityGroup.
    subnets:
      - name: subnet-1
        cidr: 10.0.1.0/24
        zone: ap-northeast-2a
      - name: subnet-2
        cidr: 10.0.2.0/24
        zone: ap-northeast-2c
    securityGroupName: test-rdbms-sg-aws
    dbEngine: mysql
    autoFillDefaults: true
    adminUserName: admin
    adminUserPassword: Password123!
    publicAccess: true
    highAvailability: false
    databaseName: sampledb
    internalDataIOTest: true
    vmOSType: "ubuntu 24.04"
    vmvCPU: "2"
    vmMemoryGiB: "4"
    vmImageId: ""
    vmSpecId: ""
    execute: true

  - rdbmsId: test-rdbms-azure
    connectionName: azure-koreacentral
    vNetName: test-rdbms-vnet-azure
    cidrBlock: 10.1.0.0/16
    subnets:
      - name: subnet-1
        cidr: 10.1.1.0/24
        zone: ""
    securityGroupName: test-rdbms-sg-azure
    dbEngine: mysql
    autoFillDefaults: true
    # Azure rejects "admin" as administratorLogin (reserved word).
    adminUserName: dbadmin
    adminUserPassword: Password123!
    # Pinned: autoFillDefaults' naive "first reported spec" pick lands on
    # Standard_B12ms (lexical sort quirk), not the intended smallest/cheapest tier.
    dbInstanceSpec: Standard_B1ms
    publicAccess: true
    highAvailability: false
    databaseName: sampledb
    internalDataIOTest: true
    vmOSType: "ubuntu 24.04"
    vmvCPU: "2"
    vmMemoryGiB: "4"
    vmImageId: ""
    vmSpecId: ""
    execute: true

  - rdbmsId: test-rdbms-gcp
    connectionName: gcp-us-central1
    vNetName: test-rdbms-vnet-gcp
    cidrBlock: 10.2.0.0/16
    subnets:
      - name: subnet-1
        cidr: 10.2.1.0/24
        zone: us-central1-a
    securityGroupName: test-rdbms-sg-gcp
    dbEngine: mysql
    autoFillDefaults: true
    adminUserName: admin
    adminUserPassword: Password123!
    storageType: PD_SSD
    publicAccess: true
    highAvailability: false
    databaseName: sampledb
    internalDataIOTest: true
    vmOSType: "ubuntu 24.04"
    vmvCPU: "2"
    vmMemoryGiB: "4"
    vmImageId: ""
    vmSpecId: ""
    execute: true

  - rdbmsId: test-rdbms-alibaba
    connectionName: alibaba-ap-northeast-2
    vNetName: test-rdbms-vnet-alibaba
    cidrBlock: 10.3.0.0/16
    subnets:
      - name: subnet-1
        cidr: 10.3.1.0/24
        zone: ""
    securityGroupName: test-rdbms-sg-alibaba
    dbEngine: mysql
    autoFillDefaults: true
    # Alibaba rejects "admin" as adminUserName (InvalidAccountName.Forbid — a reserved RDS keyword).
    adminUserName: dbadmin
    adminUserPassword: Password123!
    dbInstanceSpec: mysql.n4.large.1
    publicAccess: true
    highAvailability: false
    databaseName: sampledb
    internalDataIOTest: true
    vmOSType: "ubuntu 24.04"
    vmvCPU: "2"
    vmMemoryGiB: "4"
    vmImageId: ""
    vmSpecId: ""
    execute: true

  - rdbmsId: test-rdbms-tencent
    connectionName: tencent-ap-seoul
    vNetName: test-rdbms-vnet-tencent
    cidrBlock: 10.4.0.0/16
    subnets:
      - name: subnet-1
        cidr: 10.4.1.0/24
        zone: ""
    securityGroupName: test-rdbms-sg-tencent
    dbEngine: mysql
    autoFillDefaults: true
    # Tencent Cloud Database does not support a custom AdminUserName — always "root".
    adminUserName: root
    adminUserPassword: Password123!
    publicAccess: true
    highAvailability: false
    databaseName: sampledb
    internalDataIOTest: true
    vmOSType: "ubuntu 22.04"
    vmvCPU: "2"
    vmMemoryGiB: "4"
    vmImageId: ""
    vmSpecId: ""
    execute: true

  - rdbmsId: test-rdbms-ibm
    connectionName: ibm-us-south
    vNetName: test-rdbms-vnet-ibm
    cidrBlock: 10.5.0.0/16
    subnets:
      - name: subnet-1
        cidr: 10.5.1.0/24
        zone: ""
    securityGroupName: test-rdbms-sg-ibm
    dbEngine: mysql
    autoFillDefaults: true
    adminUserName: admin
    # IBM rejects special characters in the password, and requires 15-72 characters
    # (Password123 was only 11).
    adminUserPassword: TumblebugPass2026
    # Pinned: autoFillDefaults' first-reported dbInstanceSpec is b3c.16x64.encrypted (a
    # lexical-sort artifact, not the smallest tier) — multitenant is IBM's shared/cheapest
    # host_flavor and matches the already-verified reference in rdbms-management.md's
    # CSP Capability Summary (MySQL) section.
    dbInstanceSpec: multitenant
    publicAccess: true
    highAvailability: false
    databaseName: sampledb
    internalDataIOTest: true
    vmOSType: "ubuntu 24.04"
    vmvCPU: "2"
    vmMemoryGiB: "4"
    vmImageId: ""
    vmSpecId: ""
    execute: true

  - rdbmsId: test-rdbms-openstack
    connectionName: openstack-regionone
    vNetName: test-rdbms-vnet-openstack
    cidrBlock: 10.6.0.0/16
    subnets:
      - name: subnet-1
        cidr: 10.6.1.0/24
        zone: ""
    securityGroupName: test-rdbms-sg-openstack
    dbEngine: mysql
    autoFillDefaults: true
    adminUserName: admin
    adminUserPassword: Password123!
    publicAccess: true
    highAvailability: false
    databaseName: sampledb
    internalDataIOTest: true
    vmOSType: "ubuntu 24.04"
    vmvCPU: "2"
    vmMemoryGiB: "4"
    vmImageId: ""
    vmSpecId: ""
    execute: false

  - rdbmsId: test-rdbms-ncp
    connectionName: ncp-kr
    vNetName: test-rdbms-vnet-ncp
    cidrBlock: 10.7.0.0/16
    subnets:
      - name: subnet-1
        cidr: 10.7.1.0/24
        zone: ""
    securityGroupName: test-rdbms-sg-ncp
    dbEngine: mysql
    autoFillDefaults: true
    # NCP rejects "admin" (system account name reserved by NCP).
    adminUserName: dbadmin
    # NCP requires a special character in the password.
    adminUserPassword: Password123!
    publicAccess: true
    highAvailability: false
    databaseName: sampledb
    internalDataIOTest: true
    vmOSType: "ubuntu 22.04"
    vmvCPU: "2"
    vmMemoryGiB: "4"
    vmImageId: "23214590"
    vmSpecId: "s2-g3"
    execute: true

  - rdbmsId: test-rdbms-nhn
    connectionName: nhn-kr1
    vNetName: test-rdbms-vnet-nhn
    cidrBlock: 10.8.0.0/16
    subnets:
      - name: subnet-1
        cidr: 10.8.1.0/24
        zone: ""
    securityGroupName: test-rdbms-sg-nhn
    dbEngine: mysql
    autoFillDefaults: true
    adminUserName: myadmin
    adminUserPassword: Password123!
    publicAccess: true
    # nhnDBSGToAllowAllInbound: true auto-creates/deletes an open (0.0.0.0/0) DB Security Group on NHN for test access.
    nhnDBSGToAllowAllInbound: true
    highAvailability: false
    databaseName: sampledb
    internalDataIOTest: true
    vmOSType: "ubuntu 24.04"
    vmvCPU: "2"
    vmMemoryGiB: "4"
    vmImageId: ""
    vmSpecId: ""
    execute: true
