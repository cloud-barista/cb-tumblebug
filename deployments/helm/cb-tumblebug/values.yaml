# Default values = dev profile (kind/minikube parity with docker-compose).
# For production overrides see values-prod.yaml.
#
# Service names intentionally match docker-compose container names
# (cb-spider, cb-tumblebug-etcd, ...) so inter-service URLs are identical.
# Install ONE release per namespace.

images:
  tumblebug: cloudbaristaorg/cb-tumblebug:0.13.2
  spider: cloudbaristaorg/cb-spider:0.13.2
  terrarium: cloudbaristaorg/mc-terrarium:0.1.4
  mapui: cloudbaristaorg/cb-mapui:0.13.6
  mcp: cloudbaristaorg/cb-tumblebug-mcp-server:0.13.2
  etcd: gcr.io/etcd-development/etcd:v3.6.11
  postgres: postgres:16-alpine
  openbao: openbao/openbao:2.5.1
  # Used by init/unseal jobs and wait-for-db initContainers
  kubectl: alpine/k8s:1.31.13
  curl: curlimages/curl:8.10.1

imagePullPolicy: IfNotPresent

# API credentials (same keys as compose .env). Override in production.
auth:
  tbApiUsername: default
  tbApiPassword: default
  spApiUsername: default
  spApiPassword: default
  terrariumApiUsername: default
  terrariumApiPassword: default

tumblebugPostgres:
  user: tumblebug
  password: tumblebug
  database: tumblebug
  storage: 5Gi
  storageClassName: ""

spiderPostgres:
  user: spider
  password: spider
  database: cb_spider
  storage: 2Gi
  storageClassName: ""

etcd:
  storage: 2Gi
  storageClassName: ""

openbao:
  enabled: true
  storage: 1Gi
  storageClassName: ""

# Overlay files under /app/assets from a ConfigMap instead of the copy baked into the
# image, so editing e.g. assets/cloudinfo.yaml to register a new CSP does not require
# an image rebuild. Compose gets this for free via its ./assets/ bind mount.
# Managed by `make k-assets` / `make k-assets-off`; `files` empty means "use the image".
assetsOverride:
  configMapName: cb-tumblebug-assets
  files: []

tumblebug:
  # Prefer a node running cb-tumblebug's metadb (etcd + postgres), keeping that frequent
  # coordination/DB traffic node-local (soft, so it still schedules on a single-node cluster).
  colocateWithMetadb: true
  # K8s-recommended settings (compose keeps its own defaults)
  logWriter: stdout
  # json (not console) so log collectors render cleanly and the interaction dashboard can
  # parse requests/calls with `| json`. Console output emits ANSI color codes that show as
  # garbage in Loki. Switch back to console for raw human-readable kubectl logs if preferred.
  logFormat: json
  logLevel: debug
  readyzCheckDeps: "true"
  shutdownTimeoutMs: "300000"
  terminationGracePeriodSeconds: 330
  # sslmode for the metadata PostgreSQL connection ("" = server default: disable).
  # Set e.g. "require" for managed/TLS-enabled PostgreSQL.
  postgresSslMode: ""
  selfEndpoint: ""
  allowOrigins: "*"
  # Memory limit contains request-history/status-cache growth on large infras
  resources:
    requests:
      memory: 2Gi
    limits:
      memory: 16Gi

spider:
  # Number of cb-spider replicas. cb-spider is the outbound CSP-call worker; scaling it out
  # spreads concurrent multi-CSP/region call load across nodes (requests round-robin per call
  # because the client uses Connection: close). All replicas share one cb-spider-postgres.
  # NOTE: multi-replica over a shared metadb is not yet a validated cb-spider mode — smoke-test
  # (scale to 2-3, provision a multi-region infra, watch per-pod load + check for errors/dupes)
  # before relying on it. Keep at 1 for the standard single-instance behavior.
  replicas: 1
  # Prefer scheduling cb-spider and cb-tumblebug onto different nodes (soft anti-affinity, so
  # it still schedules on a single-node cluster). Isolates the heavy CSP-call worker from the API.
  separateFromTumblebug: false
  # Prefer the node running cb-spider-postgres, so the frequent metadb traffic stays node-local (soft).
  colocateWithPostgres: true
  logLevel: error
  hiscallLogLevel: error
  # Go GC soft target (no hard limit): in-flight VM creations hold ~15 MB each,
  # so RSS peaked at 13 GB during an 800-node run. Keeps RSS near this value
  # under load; exceeding it only slows GC, it never kills the process.
  goMemLimit: 8GiB
  resources: {}

terrarium:
  enabled: true
  storage: 1Gi
  storageClassName: ""
  resources: {}

mapui:
  enabled: true
  resources: {}
  # Preset remote-command popup parameters (keys match <PLACEHOLDER> names).
  # NOTE: values end up in the served JS bundle — anyone who can open MapUI can
  # read them. Use only where MapUI itself is access-controlled (localhost/VPN).
  # Do NOT put real tokens here (this file is tracked) — put them in the
  # gitignored deployments/helm/cb-tumblebug/values-local.yaml instead; k-up
  # picks it up automatically and it persists across upgrades. e.g.:
  #   placeholderDefaults:
  #     HF_TOKEN: hf_xxx
  #     TAVILY_API_KEY: tvly-xxx
  #     DISCORD_TOKEN: xxx
  placeholderDefaults: {}

mcp:
  # Requires a published cb-tumblebug-mcp-server image (compose builds it locally)
  enabled: false
  resources: {}

agentgateway:
  # Governed MCP entrypoint (standalone static-config mode; requires mcp.enabled)
  enabled: false
  image: ghcr.io/agentgateway/agentgateway:v1.3.1
  resources: {}
  auth:
    # JWT authentication on the /mcp route (enable via `make k-mcp-auth-on`,
    # which also generates the local keypair and fills jwks below).
    # Tokens are minted host-side with `make k-mcp-token` — no IdP required.
    enabled: false
    issuer: cb-tumblebug-dev
    audience: cb-tumblebug-mcp
    # Public JWKS JSON (single line). Public-key material only — safe to persist.
    jwks: ""

gateway:
  # Single external entrypoint via Gateway API (/ -> mapui, /tumblebug -> API, /mcp -> MCP).
  # Requires a Gateway API implementation in the cluster (e.g., Envoy Gateway).
  enabled: false
  className: eg
  # Create the GatewayClass as part of this release (set false if the cluster
  # already provides one; then point className at it)
  createClass: true
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  # Optional host-based routing, e.g. ["tumblebug.example.com"]; empty = match any host
  hostnames: []
  tls:
    # HTTPS listener (:443). Without secretName a self-signed cert is generated
    # once and reused across upgrades. For trusted certs, point secretName at a
    # kubernetes.io/tls Secret (e.g., issued by cert-manager).
    enabled: false
    secretName: ""

networkPolicy:
  # Ingress lockdown (default-deny + intra-namespace + gateway data plane).
  # Requires a NetworkPolicy-enforcing CNI — no-op on default kind (kindnet).
  enabled: false
  gatewayNamespace: envoy-gateway-system
