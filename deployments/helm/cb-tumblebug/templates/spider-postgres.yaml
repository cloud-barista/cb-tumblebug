apiVersion: v1
kind: Service
metadata:
  name: cb-spider-postgres
  labels:
    {{- include "cb.labels" . | nindent 4 }}
spec:
  selector:
    app: cb-spider-postgres
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cb-spider-postgres
  labels:
    {{- include "cb.labels" . | nindent 4 }}
spec:
  serviceName: cb-spider-postgres
  replicas: 1
  selector:
    matchLabels:
      app: cb-spider-postgres
  template:
    metadata:
      labels:
        app: cb-spider-postgres
        {{- include "cb.labels" . | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.images.postgres }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: cb-stack-secret, key: SP_POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: cb-stack-secret, key: SP_POSTGRES_PASSWORD } }
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: cb-stack-secret, key: SP_POSTGRES_DATABASE } }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - { name: postgres, containerPort: 5432 }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
          {{- with .Values.spiderPostgres.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            tcpSocket: { port: 5432 }
            periodSeconds: 15
            failureThreshold: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.spiderPostgres.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.spiderPostgres.storage }}
