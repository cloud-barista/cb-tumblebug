# Configuration for Cluster(Kubernetes) of Cloud Service Providers (CSPs)
# This file is used to define the feature of clusters

# The file is in YAML format and contains the following fields:
# k8scluster: Top level key
#   <csp>: Name of the CSP
#     nodeGroupsOnCreation: [true/false]
#     nodeImageDesignation: [true/false]
#     requiredSubnetCount: [required number of subnets to create a kubernetes cluster, default value is 1]
#     version:
#       - region: [region1, region2, common(special keyword: most of regions)]
#         available:
#           - name: "1.30" [available version name (use double quotes)]
#             id: "1.30" [available version name (use double quotes)]
#     nodeGroupNamingRule: [regular expression or no restriction if empty]
#       Also bounds auto-generated node group names (used when a request leaves the name empty).
#     nodeSpecNamingRule: [regular expression for node spec names (CspSpecName), no restriction if empty]
#     initialNodeGroupManagedByCluster: [true/false, default false]
#       The node group created together with the cluster is lifecycle-bound to it and
#       cannot be deleted independently via the node group API.
#     autoScalingOffNodeSize: [{min: N, max: N}, default none]
#       The node-size floor the CSP still demands while autoscaling is disabled.
#       Most CSPs ignore Min/Max in that state - omit the key for those. Some even reject
#       a non-zero MinNodeSize when autoscaling is off, so never set min unless the CSP
#       demands it. A field left out keeps the value the client requested.
#

k8scluster:
  aws:
    nodeGroupsOnCreation: false
    nodeImageDesignation: true
    requiredSubnetCount: 2
    version:
      - region: [common]
        available: # Updated: 2026-10-02 (verified with aws eks describe-cluster-versions --region ap-northeast-2)
          - name: "1.36"
            id: "1.36"
          - name: "1.35"
            id: "1.35"
          - name: "1.34"
            id: "1.34"
          # Extended support only (standard support ended 2026-07-29)
          # - name: "1.33"
          #   id: "1.33"
          # Deprecated versions (not available in AWS console as of 2026-05)
          # - name: "1.32"
          #   id: "1.32"
          # - name: "1.31"
          #   id: "1.31"
          # - name: "1.30"
          #   id: "1.30"
    rootDisk:
      - region: [common]
        type:
          - name: default
            id: default
        size:
          min: 10
          max: 40
  azure:
    nodeGroupsOnCreation: true
    nodeImageDesignation: false
    requiredSubnetCount: 1
    nodeGroupNamingRule: ^[a-z][a-z0-9]{0,11}$
    version:
      - region: [westindia]
        # no available version
      - region: [common]
        # AKS keeps each patch creatable for at least two months, so explicit patches are listed.
        # A new patch can reach regions up to 10 business days apart; list only patches that
        # every region offers (az aks get-versions -l <region>).
        available: # Updated: 2026-10-06 (koreacentral/westeurope/westus all offer 1.36.4 / 1.35.8 / 1.34.11)
          - name: "1.36"
            id: "1.36.4"
          - name: "1.35"
            id: "1.35.8"
          - name: "1.34"
            id: "1.34.11"
          # EOL versions (no longer supported for new cluster creation without LTS):
          # 1.33 EOL: Jul 2026, 1.32 EOL: Mar 2026, 1.31 EOL: Nov 1 2025, 1.30 EOL: Aug 22 2025
    rootDisk:
      - region: [common]
        type:
          - name: default
            id: default
        size:
          min: 10
          max: 40
  gcp:
    nodeGroupsOnCreation: true
    nodeImageDesignation: true
    requiredSubnetCount: 1
    version:
      - region: [common]
        # ref: https://cloud.google.com/kubernetes-engine/docs/release-notes-stable
        # Minor version aliases are used because a STABLE channel patch (e.g. 1.35.6-gke.1250001)
        # is replaced every 1-3 weeks and can no longer create a cluster once removed.
        # With no release channel set, GKE enrolls the cluster in STABLE and picks its patch for
        # the alias; the actual patch is recorded as the cluster version after creation.
        # gcloud container get-server-config --region=asia-northeast3 --format=json | jq '{validMasterVersions, channels: [.channels[] | {channel, defaultVersion, validVersions}]}'
        available: # Updated: 2026-10-06 (both minors in STABLE; 1.33 standard support ended 2026-08)
          - name: "1.35"
            id: "1.35"
          - name: "1.34"
            id: "1.34"
      - region: [africa-south1]
        # addnodegroup unavailble
    rootDisk:
      - region: [common]
        type:
          - name: default
            id: default
        size:
          min: 10
          max: 40
  alibaba:
    nodeGroupsOnCreation: false
    nodeImageDesignation: true
    requiredSubnetCount: 1
    initialNodeGroupManagedByCluster: true
    version:
      # ServiceUnavailable or NotSupportedSLB
      - region: [me-east-1, cn-zhangjiakou, cn-hangzhou, cn-shenzhen, cn-chengdu, ap-south-1, ap-southeast-2]
      # ap-northeast-1,ap-northeast-2,ap-southeast-1,ap-southeast-3,ap-southeast-5,us-west-1,us-east-1,eu-central-1,eu-west-1,cn-beijing,cn-hongkong,cn-shanghai,cn-huhehaote,cn-heyuan,cn-wulanchabu,cn-guangzhou
      - region: [common] 
        # Verified with DescribeKubernetesVersionMetadata on 2026-10-02 (allowed: 1.36.2 / 1.35.7 / 1.34.10).
        # 1.34 is still creatable but its support expired on 2026-09-30, so it is excluded.
        available:
          - name: "1.36"
            id: "1.36.2-aliyun.1"
          - name: "1.35"
            id: "1.35.7-aliyun.1"
    rootDisk:
      - region: [common]
        type:
          - name: cloud_essd
            id: cloud_essd
        size:
          min: 10
          max: 40
  nhn:
    # CSP constraint: the NKS nodegroup API rejects max_node_count 0 (verified 2026-09-10,
    # HTTP 400 "Value should be greater or equal to 1"). Min stays unset because the
    # CB-Spider driver rejects a non-zero Min while autoscaling is off.
    autoScalingOffNodeSize: {max: 1}
    nodeGroupsOnCreation: true
    nodeImageDesignation: true
    requiredSubnetCount: 1
    version:
      - region: [kr1, kr2]
        available: # Updated: 2026-09-29 (NHN API confirmed on kr1: Available v1.35.5, v1.34.3, v1.33.4)
          - name: "1.35"
            id: "v1.35.5"
          - name: "1.34"
            id: "v1.34.3"
          - name: "1.33"
            id: "v1.33.4"
    rootDisk:
      - region: [common]
        type:
          - name: default
            id: default
        size:
          min: 10
          max: 40
  tencent:
    nodeGroupsOnCreation: false
    nodeImageDesignation: true
    requiredSubnetCount: 1
    initialNodeGroupManagedByCluster: true
    # Not a CSP constraint: TKE itself accepts MinSize 0 - its CreateClusterNodePool reference
    # uses "MinSize":0 in the request example
    # (https://intl.cloud.tencent.com/document/product/457/38781). The floor exists only
    # because validateAtAddNodeGroup in the CB-Spider driver rejects anything below 1, while
    # the driver forwards Min/Max/Desired to TKE as AutoScalingGroup parameters regardless of
    # EnableAutoscale. Drop this once that check is fixed upstream. Nothing scales while
    # autoscaling is off, so max needs no headroom.
    autoScalingOffNodeSize: {min: 1, max: 1}
    version:
      # ServiceUnavailable
      - region: [ap-mumbai, eu-moscow, na-toronto]
      # ServiceCanNotAccess
      - region: [ap-beijing, ap-chengdu, ap-chongqing, ap-guangzhou, ap-hongkong, ap-nanjing, ap-shanghai]
      - region: [common]
        available:
          # Updated: 2026-05-19 (1.30 EOM Feb-2026, 1.28 EOFS Apr-2026 — no new clusters)
          - name: "1.34"
            id: "1.34.1"
          - name: "1.32"
            id: "1.32.2"
    rootDisk:
      - region: [common]
        type:
          - name: default
            id: default
        size:
          min: 10
          max: 40
  ncp:
    nodeGroupsOnCreation: true
    nodeImageDesignation: false
    requiredSubnetCount: 1
    nodeGroupNamingRule: '^[a-z][a-z0-9-]{1,18}[a-z0-9]$'
    # NKS KVM node pools accept only {c,s,m}{vCPU}-g3 (Intel) or -g3a (AMD) specs (verified 2026-09-29 in kr/sgn/jpn).
    nodeSpecNamingRule: '^[csm][0-9]+-g3a?$'
    version:
      - region: [common]
        available: # Updated: 2026-09-30 (KVM hypervisor, NCP API confirmed in kr/sgn/jpn)
          - name: "1.36"
            id: "1.36.2-nks.2"
          - name: "1.35"
            id: "1.35.3-nks.2"
          - name: "1.34"
            id: "1.34.3-nks.2"
    rootDisk:
      - region: [common]
        type:
          - name: default
            id: default
        size: # KVM node pool storageSize (GB)
          min: 100
          max: 2000
  ibm:
    # Not a CSP constraint: the driver only sends Min/Max to IKS inside its
    # `if OnAutoScaling` branch, so IKS never sees them while autoscaling is off. The floor
    # exists solely because validateAtCreateCluster/validateAtAddNodeGroup reject anything
    # below 1 with no OnAutoScaling guard. Drop this once that check is fixed upstream.
    autoScalingOffNodeSize: {min: 1, max: 1}
    nodeGroupsOnCreation: true
    nodeImageDesignation: false
    requiredSubnetCount: 1
    version:
      - region: [common]
        available: # Updated: 2026-10-06 (verified with containers.cloud.ibm.com/global/v1/versions)
          - name: "1.36"
            id: "1.36.5"
          - name: "1.35"
            id: "1.35.9"
          # Deprecated: 1.34 (end of support 2027-01-20), 1.33 (end of support 2026-10-14)
    rootDisk:
      - region: [common]
        type:
          - name: default
            id: default
        size:
          min: 10
          max: 40