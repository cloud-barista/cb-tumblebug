# Configuration for Pattern Extraction from Cloud Resources
# This file defines patterns to extract various information from cloud resources

extractionPatterns:
  osType:
    ubuntu:
      name: "Ubuntu"
      versions: ["26.04", "25.10", "25.04", "24.10", "24.04", "23.10", "23.04", "22.10", "22.04", "20.04", "18.04", "16.04"]
      defaultVersion: ""
      patterns: ["ubuntu", "canonical"]
      
      # Rules for identifying basic OS images
      # Basic images are clean, official OS installations without additional software or customization
      basicImageRules:
        # Common rules applied to all CSPs by default
        # Designed to be CSP-agnostic using keyword-based patterns
        common:
          include:
            # Note: Pattern matching is case-insensitive
            # Keyword-based patterns (CSP-independent)
            - "*ubuntu*server*"      # Any image with "ubuntu" and "server" keywords
            - "*ubuntu*minimal*"     # Any image with "ubuntu" and "minimal" keywords
            - "*ubuntu*base*"        # Any image with "ubuntu" and "base" keywords
            - "*ubuntu*64bit*"       # 64-bit format without space (kt, alibaba, etc.)
            - "*os-ubuntu*image*"    # KT Cloud standard Ubuntu image format (e.g., os-ubuntu24.04-image-20260929)
            - "ubuntu-* (hypervisor:bm)" # NCP Bare Metal Ubuntu image format
            - "*ubuntu*lts*"         # LTS images with any separator (GCP format)
            - "ubuntu/images/*"      # Path-style naming (common in AWS)
            # Description-based patterns
            - "ubuntu server*"       # Images named/described as Ubuntu Server
            - "ubuntu * lts*"        # LTS version images
            - "ubuntu * 64 bit*"     # 64-bit specification format (including "64 bit ARM Edition" on Alibaba)
            - "ubuntu *(arm64)"      # Tencent ARM64 Ubuntu format (e.g., "Ubuntu 22.04(arm64)")
            - "ubuntu-2*.04"         # OpenStack standard Ubuntu image format (e.g., "ubuntu-22.04", "ubuntu-24.04")
          exclude:
            # Note: Pattern matching is case-insensitive
            # Use specific patterns to avoid false positives
            # Legacy 32-bit or special boot/hardware-only variants
            - "*32bit*"              # Exclude legacy 32-bit images (e.g., Tencent Ubuntu 14.04/16.04 32bit)
            - "*32-bit*"
            - "*uefi edition*"       # Exclude Alibaba UEFI-only edition when standard UEFI-Preferred base exists
            - "* for amd*"           # Exclude Alibaba CPU-vendor-specific edition
            - "* for scc*"           # Exclude Alibaba Super Computing Cluster edition
            - "*trust edition*"      # Exclude Alibaba Trust edition
            - "*dengbao*"            # Exclude Alibaba DengBao compliance edition
            # Commercial/Enterprise variants
            - "*ubuntu-pro*"         # Ubuntu Pro (paid support)
            - "*-pro-*"              # Pro variants with dashes
            - "*:pro-*"              # Azure format pro images
            # The three above all assume a hyphenated image name. The text these rules are
            # matched against is OSDistribution, and GCP puts prose there - "Canonical,
            # Ubuntu, 22.04 LTS Pro Server, amd64 jammy pro server image built on ..." - so
            # the hyphen forms never fire and a licensed image was classified as a clean
            # base image. Space-separated forms cover it.
            - "*lts pro*"            # "22.04 LTS Pro Server", "22.04 LTS Pro FIPS" (GCP)
            - "*minimal pro*"        # "22.04 LTS Minimal Pro" (GCP)
            - "* pro server*"        # "... amd64 jammy pro server image ..." (GCP)
            # Accelerator images that are not GPU images: a TPU image carries an
            # accelerator runtime and is not a clean base install, but the GPU detector
            # looks for nvidia/gpu/cuda and never matches it.
            - "*tpu version*"        # "22.04 LTS TPU version(s): v5e/v5p/v6e" (GCP)
            - "*marketplace*"
            # Development/Testing  
            - "*daily*"
            - "*-dev-*"              # More specific than "*-dev*"
            # GPU/ML images
            - "*deep learning*"
            - "* gpu*"               # Images with GPU in name (space prefix)
            - "*-gpu*"               # Images with GPU suffix (e.g., ubuntu-22.04-gpu)
            - "*gpu driver*"         # GPU driver pre-installed
            - "*gpusvr*"             # KT GPU server images
            - "*nvidia*"             # NVIDIA-related images
            - "*cuda*"               # CUDA images
            - "*grid*"               # NVIDIA GRID vGPU driver (Tencent)
            # Custom kernel images
            - "*tk4*"                # Tencent Kernel 4.x (custom kernel)
            # Security/Compliance variants
            - "*-confidential-*"     # Confidential VM images (hyphen-delimited)
            - "*cvm:*"               # Confidential VM (Azure format)
            - "*fips*"
            # Kubernetes/Container optimized
            - "*-eks-*"              # EKS optimized
            - "*kubernetes*"
            - "*k8s*"
            - "* - container*"       # Container-optimized images (NHN)
            # Special purpose images
            - "* for nat*"           # NAT gateway images (NHN)
            # Pre-installed software (not basic OS)
            - "*sql*"                # Database pre-installed (MySQL, PostgreSQL, SQL Server)
            - "*mariadb*"            # MariaDB
            - "*redis*"              # Redis
            - "*kafka*"              # Apache Kafka
            - "*cubrid*"             # CUBRID
            - "* with *"             # "with X" pattern (NHN style - middleware pre-installed)

        # CSP-specific overrides
        # - If include is defined and not empty, it overrides common include patterns
        # - If exclude is defined and not empty, it overrides common exclude patterns
        cspSpecific:
          azure:
            include:
              # Ubuntu: Limit to official Canonical server/minimal streams
              # (avoids marketplace images with broad "ubuntu" and "lts" tokens)
              # NOTE: Use leading wildcard to support URN format with publisher prefix
              # e.g., "Canonical:0001-com-ubuntu-server-jammy:22_04-lts-gen2:latest"
              - "*0001-com-ubuntu-server*"
              - "*0001-com-ubuntu-minimal*"
              - "*ubuntuserver:*"
              - "*ubuntu-*-lts:server*"
              - "*ubuntu-*-lts:minimal*"
              # CentOS, Debian, RHEL, etc: Use common patterns from other CSPs
              - "*centos*server*"
              - "*centos*minimal*"
              - "*debian*server*"
              - "*debian*minimal*"
              - "*rhel*server*"
              - "*rhel*minimal*"
              - "*rocky*server*"
              - "*rocky*minimal*"
              - "*alma*server*"
              - "*alma*minimal*"
              - "*oracle*server*"
              - "*oracle*minimal*"
              - "*fedora*server*"
              - "*fedora*minimal*"
    centos:
      name: "CentOS"
      versions: ["10", "9", "8", "7"]
      defaultVersion: ""
      patterns: ["centos", "centoscore"]
    debian:
      name: "Debian"
      versions: ["13", "12", "11", "10", "9"]
      defaultVersion: ""
      patterns: ["debian"]
    windows:
      name: "Windows"
      versions: ["2025", "2022", "2019", "2016", "11", "10"]
      defaultVersion: ""
      patterns: ["windows", "win", "ws2025", "ws2022", "ws2019", "ws2016"]
    rhel:
      name: "Red Hat Enterprise Linux"
      versions: ["10", "9", "8", "7"]
      defaultVersion: ""
      patterns: ["rhel", "red hat", "redhat"]
    amazonlinux:
      name: "Amazon Linux"
      versions: ["2023", "2"]
      defaultVersion: ""
      # Note: "amazon" pattern removed - too broad, matches AWS image metadata (ImageOwnerAlias: "amazon")
      # and causes Ubuntu/Windows images to be misclassified as Amazon Linux
      patterns: ["amazon linux", "amazon_linux", "amzn", "al20", "amazon-eks", "bottlerocket"]
    azurelinux:
      name: "Azure Linux"
      versions: ["3", "2"]
      defaultVersion: ""
      patterns: ["azure-linux", "azurelinux", "azure linux"]
    fedora:
      name: "Fedora"
      versions: ["42", "41", "40", "39", "38", "37", "36", "35"]
      defaultVersion: ""
      patterns: ["fedora"]
    suse:
      name: "SUSE Linux Enterprise Server"
      versions: ["16", "15", "12"]
      defaultVersion: ""
      patterns: ["suse", "sles", "sles-sap"]
    rocky:
      name: "Rocky Linux"
      versions: ["10", "9", "8"]
      defaultVersion: ""
      patterns: ["rocky", "rlc-pro"]
    oracle:
      name: "Oracle Linux"
      versions: ["10", "9", "8", "7"]
      defaultVersion: "9"
      patterns: ["oracle"]
    alma:
      name: "AlmaLinux"
      versions: ["10", "9", "8"]
      defaultVersion: ""
      patterns: ["alma"]
    alibaba:
      name: "Alibaba Cloud Linux"
      versions: ["4", "3", "2"]
      defaultVersion: ""
      patterns: ["alibaba cloud linux", "aliyun", "alibaba linux"]
    tencent:
      name: "Tencent Linux"
      versions: ["4", "3", "2"]
      defaultVersion: ""
      patterns: ["tlinux", "tencentos"]
    navix:
      name: "NAVIx"
      versions: ["9"]
      defaultVersion: ""
      patterns: ["navix"]
    anolis:
      name: "Anolis OS"
      versions: ["23", "8", "7"]
      defaultVersion: ""
      patterns: ["anolis"]
    freebsd:
      name: "FreeBSD"
      versions: ["15", "14", "13", "12", "11"]
      defaultVersion: ""
      patterns: ["freebsd"]
    opencloudos:
      name: "OpenCloudOS"
      versions: ["9", "8", "7"]
      defaultVersion: ""
      patterns: ["opencloudos"]
    cos:
      name: "Container-Optimized OS"
      versions: ["125", "121", "117", "113", "109", "105"]
      defaultVersion: ""
      patterns: ["container-optimized os", "cos-stable", "cos-1", "cos_containerd"]
    flatcar:
      name: "Flatcar Container Linux"
      versions: []
      defaultVersion: ""
      patterns: ["flatcar"]
    
  # GPU image identification patterns (case-insensitive, any match = GPU)
  gpuPatterns:
    - "gpu"
    - "cuda"
    - "nvidia"
    - "ubuntu-hpc"
    - "dsvm"
    - "deep learning"
    - "tensorflow"
    - "pytorch"
    - "keras"
    - "caffe"
    - "machine learning"
    - "optimized-for-ml"

  # GPU image exclusion patterns (case-insensitive, any match overrides gpuPatterns → not GPU)
  gpuExcludePatterns:
    - "nhncloud_allow_gpu_flavor:false"           # NHN: property key indicating GPU NOT allowed
    - "workloads on vms that have attached gpus"  # GCP: gVNIC description mentioning GPUs incidentally

  # Rules for identifying basic GPU images per CSP
  # Follows the same include/exclude wildcard logic as basicImageRules
  basicGpuImageRules:
    common:
      include: []
      exclude:
        - "*windows*"   # Exclude Windows-based GPU images from basic selection
    cspSpecific:
      aws:
        include:
          - "*deep learning*nvidia*gpu ami*ubuntu*"  # AWS Deep Learning AMI (DLAMI) Ubuntu — single-VM GPU use
      gcp:
        include:
          - "*deeplearning-platform-release*"   # Google Deep Learning VM (CUDA/PyTorch/TF)
          - "*ubuntu-os-accelerator-images*"    # Ubuntu + NVIDIA driver
          - "*rocky-linux-accelerator-cloud*"   # Rocky Linux + NVIDIA driver
          - "*ml-images*"                       # Google ML-optimized images
      azure:
        include:
          - "*microsoft-dsvm:ubuntu-hpc*"   # Ubuntu HPC (GPU-optimized)
          - "*microsoft-dsvm:ubuntu-2004*"  # DSVM Ubuntu 20.04
          - "*microsoft-dsvm:ubuntu-2204*"  # DSVM Ubuntu 20.04
      ibm:
        include:
          - "*red hat enterprise linux ai*nvidia*"  # RHEL AI for NVIDIA accelerators
      alibaba:
        include:
          - "*ubuntu*gpu*driver*cuda*"   # Ubuntu with NVIDIA GPU Driver and CUDA
      ncp:
        include:
          - "*ubuntu*gpu*"   # Ubuntu GPU image (e.g. ubuntu-24.04-gpu)
          - "*rocky*gpu*"    # Rocky Linux GPU image
          - "*navix*gpu*"    # NAVIx GPU image
      kt:
        include:
          - "*ubuntu*gpusvr*"   # KT GPU server Ubuntu images (CUDA pre-installed)
          - "*rocky*gpusvr*"    # KT GPU server Rocky Linux images
      nhn:
        include:
          - "*ubuntu*nvidia*"        # Ubuntu with NVIDIA driver
          - "*ubuntu*deep learning*" # Ubuntu Deep Learning image
  
  # Kubernetes image identification patterns (case-insensitive, any match = Kubernetes)
  k8sPatterns:
    # General terms
    - "kubernetes"
    - "k8s"
    # Removed "container" - too broad, causes false positives
    
    # CSP-specific terms
    - "eks"                # AWS Elastic Kubernetes Service
    - "amazon-eks"         # AWS EKS (full name in AMI)
    - "eks-optimized"      # AWS
    - "aks"                # Azure Kubernetes Service
    - "azurek8s"           # Azure
    - "gke"                # Google Kubernetes Engine
    - "cos-stable"         # GCP Container-Optimized OS (more specific than "cos")
    - "cos-cloud"          # GCP
    - "container-optimized" # GCP
    - "ack"                # Alibaba Cloud Container Service for Kubernetes
    - "aliyun-linux-k8s"   # Alibaba Cloud
    - "tke"                # Tencent Kubernetes Engine
    - "nks"                # NHN Cloud, NCP Kubernetes Service
    - "iks"                # IBM Kubernetes Service
    
    # K8s-dedicated/optimized OS distributions
    - "bottlerocket-aws-k8s"  # AWS Bottlerocket for Kubernetes (excludes ECS)
    - "flatcar"            # Flatcar Container Linux
    - "talos"              # Talos Linux (K8s-specific OS)
