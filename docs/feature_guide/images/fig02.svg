  <text x="440" y="209" fill="#0f172a" font-size="12.5" font-weight="700" text-anchor="middle">TB</text>
  <rect x="260" y="272" width="360" height="74" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="440" y="299" fill="#475569" font-size="10.5" font-weight="700" text-anchor="middle">▸ 10,456 REST Calls</text>
  <line x1="276" y1="305" x2="604" y2="305" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="440" y="323" fill="#0f172a" font-size="12.5" font-weight="700" text-anchor="middle">SP</text>
  <rect x="260" y="382" width="360" height="94" rx="8" fill="#fff5f5" stroke="#dc2626" stroke-width="2"/>
  <text x="440" y="409" fill="#475569" font-size="10.5" font-weight="700" text-anchor="middle">▸ 10,456 + 30,000 Pre/Post Calls</text>
  <line x1="276" y1="415" x2="604" y2="415" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="440" y="433" fill="#7f1d1d" font-size="12.5" font-weight="700" text-anchor="middle">CSP APIs</text>
  <text x="440" y="453" fill="#991b1b" font-size="11.5" font-weight="500" text-anchor="middle">(429 Throttling &amp; Dropped Sessions)</text>
  <rect x="260" y="570" width="360" height="64" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="440" y="607" fill="#0f172a" font-size="12.5" font-weight="700" text-anchor="middle">User Read API (35ms Status)</text>
  <rect x="260" y="670" width="360" height="66" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="440" y="698" fill="#1e3a8a" font-size="12.5" font-weight="700" text-anchor="middle">TB</text>
  <text x="440" y="718" fill="#1e40af" font-size="11.5" font-weight="500" text-anchor="middle">(In-Memory Status Store &amp; Read Cache)</text>
  <rect x="260" y="772" width="360" height="94" rx="8" fill="#fffbeb" stroke="#ea580c" stroke-width="2"/>
  <text x="440" y="799" fill="#475569" font-size="10.5" font-weight="700" text-anchor="middle">▸ Background 15s Sweep (~146 Regional Calls)</text>
  <line x1="276" y1="805" x2="604" y2="805" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="440" y="823" fill="#7c2d12" font-size="12.5" font-weight="700" text-anchor="middle">Direct CSP Batch/Bulk SDK</text>
  <text x="440" y="843" fill="#9a3412" font-size="11.5" font-weight="500" text-anchor="middle">(8s Singleflight + Public IP Cache)</text>
  <rect x="260" y="902" width="360" height="64" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="440" y="939" fill="#14532d" font-size="12.5" font-weight="700" text-anchor="middle">CSP APIs (Zero Throttling)</text>
