  <text x="237" y="140" fill="#334155" font-size="11.5" font-weight="500" text-anchor="middle">Fields: Method, URI, status, latency</text>
  <rect x="450" y="72" width="386" height="86" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
