  <text x="643" y="704" fill="#9a3412" font-size="11.5" font-weight="500" text-anchor="middle">+ OOM/Restarts</text>
  <text x="643" y="724" fill="#9a3412" font-size="11.5" font-weight="500" text-anchor="middle">+ etcd DB Size &amp; WAL p99</text>
