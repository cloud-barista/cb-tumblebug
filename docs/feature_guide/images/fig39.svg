  <text x="237" y="724" fill="#9a3412" font-size="11.5" font-weight="500" text-anchor="middle">+ Per-Subsystem Activity</text>
  <rect x="450" y="636" width="386" height="106" rx="8" fill="#fffbeb" stroke="#ea580c" stroke-width="2"/>
  <text x="643" y="664" fill="#7c2d12" font-size="12.5" font-weight="700" text-anchor="middle">Prometheus Engine</text>
