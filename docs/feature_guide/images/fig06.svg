<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 676" width="100%" height="auto" style="text-size-adjust: none; -webkit-text-size-adjust: none;" font-family="'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-4%" width="104%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="4" y="4" width="872" height="668" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <rect x="20" y="20" width="840" height="642" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <line x1="104" y1="110" x2="104" y2="648" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5,4"/>
  <rect x="28" y="32" width="153" height="78" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="104" y="58" fill="#1e3a8a" font-size="11.5" font-weight="700" text-anchor="middle">Background Batch</text>
  <text x="104" y="76" fill="#1e3a8a" font-size="11.5" font-weight="700" text-anchor="middle">Sweeper (15s</text>
  <text x="104" y="94" fill="#1e3a8a" font-size="11.5" font-weight="700" text-anchor="middle">Cycle)</text>
  <line x1="271" y1="110" x2="271" y2="648" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5,4"/>
  <rect x="195" y="32" width="153" height="78" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="271" y="58" fill="#1e3a8a" font-size="11.5" font-weight="700" text-anchor="middle">Batch Status</text>
  <text x="271" y="76" fill="#1e3a8a" font-size="11.5" font-weight="700" text-anchor="middle">Cache (8s</text>
  <text x="271" y="94" fill="#1e3a8a" font-size="11.5" font-weight="700" text-anchor="middle">Singleflight)</text>
  <line x1="438" y1="110" x2="438" y2="648" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5,4"/>
  <rect x="362" y="32" width="153" height="78" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="438" y="67" fill="#1e3a8a" font-size="11.5" font-weight="700" text-anchor="middle">AWS EC2 Batch</text>
  <text x="438" y="85" fill="#1e3a8a" font-size="11.5" font-weight="700" text-anchor="middle">SDK</text>
  <line x1="605" y1="110" x2="605" y2="648" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5,4"/>
  <rect x="529" y="32" width="153" height="78" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="605" y="58" fill="#1e3a8a" font-size="11.5" font-weight="700" text-anchor="middle">Independent</text>
  <text x="605" y="76" fill="#1e3a8a" font-size="11.5" font-weight="700" text-anchor="middle">Public IP Cache</text>
  <text x="605" y="94" fill="#1e3a8a" font-size="11.5" font-weight="700" text-anchor="middle">(In-Memory)</text>
  <line x1="772" y1="110" x2="772" y2="648" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5,4"/>
  <rect x="696" y="32" width="153" height="78" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="772" y="67" fill="#1e3a8a" font-size="11.5" font-weight="700" text-anchor="middle">Status Store &amp;</text>
  <text x="772" y="85" fill="#1e3a8a" font-size="11.5" font-weight="700" text-anchor="middle">etcd</text>
  <line x1="104" y1="150" x2="267" y2="150" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="32" y="122" width="338" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="201" y="137" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">1. Regional Batch Status Request (500 IDs)</text>
  <rect x="32" y="176" width="478" height="32" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="271" y="196" fill="#92400e" font-size="11" font-weight="700" text-anchor="middle">Coalesce concurrent callers via inflight channel outside mutex</text>
  <line x1="271" y1="262" x2="434" y2="262" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="188" y="234" width="332" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="354" y="249" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">2. 1 Regional Batch Call (up to 1,000 IDs)</text>
  <line x1="438" y1="318" x2="601" y2="318" stroke="#16a34a" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-green)"/>
  <rect x="339" y="290" width="364" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="521" y="305" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">3. Store Public IPs for All Returned Instances</text>
  <line x1="438" y1="374" x2="275" y2="374" stroke="#16a34a" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-green)"/>
  <rect x="212" y="346" width="284" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="354" y="361" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">4. Map of Instance Running Statuses</text>
  <line x1="271" y1="430" x2="108" y2="430" stroke="#16a34a" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-green)"/>
  <rect x="91" y="402" width="192" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="187" y="417" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">5. Batch Status Result</text>
  <line x1="104" y1="486" x2="601" y2="486" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="208" y="458" width="292" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="354" y="473" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">6. Lookup New Public IP for Instance</text>
  <line x1="605" y1="542" x2="108" y2="542" stroke="#16a34a" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-green)"/>
  <rect x="208" y="514" width="292" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="354" y="529" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">7. Immediate Memory Hit (0 SP Calls)</text>
  <line x1="104" y1="598" x2="768" y2="598" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="219" y="570" width="439" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="438" y="585" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">8. Persist Running + PublicIP Simultaneously (+0.0s Lag)</text>
</svg>
