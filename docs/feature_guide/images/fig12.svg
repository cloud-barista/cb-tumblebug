  <rect x="4" y="4" width="872" height="364" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <rect x="20" y="22" width="840" height="156" rx="10" fill="#ffffff" stroke="#fecaca" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="20" y="22" width="840" height="36" rx="10" fill="#fef2f2"/>
  <rect x="20" y="46" width="840" height="12" fill="#fef2f2"/>
  <line x1="20" y1="58" x2="860" y2="58" stroke="#fecaca" stroke-width="1"/>
  <rect x="36" y="29" width="87" height="22" rx="5" fill="#dc2626"/>
  <text x="79" y="44" fill="#ffffff" font-size="10.5" font-weight="700" text-anchor="middle">PROBLEM</text>
  <text x="135" y="45" fill="#991b1b" font-size="13" font-weight="700">Problem: Dual Failure Traps Across 146 Regions</text>
  <rect x="20" y="202" width="840" height="136" rx="10" fill="#ffffff" stroke="#fecaca" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="20" y="202" width="840" height="36" rx="10" fill="#fef2f2"/>
  <rect x="20" y="226" width="840" height="12" fill="#fef2f2"/>
  <line x1="20" y1="238" x2="860" y2="238" stroke="#fecaca" stroke-width="1"/>
  <rect x="36" y="209" width="87" height="22" rx="5" fill="#dc2626"/>
  <text x="79" y="224" fill="#ffffff" font-size="10.5" font-weight="700" text-anchor="middle">PROBLEM</text>
  <text x="135" y="225" fill="#991b1b" font-size="13" font-weight="700">Solution: Quota-Aware Risk Engine + Live DB Write-Through</text>
  <path d="M 237 158 L 237 203 L 643 203 L 643 248" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
  <path d="M 643 158 L 643 203 L 237 203 L 237 248" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
  <rect x="44" y="72" width="386" height="86" rx="8" fill="#fff5f5" stroke="#dc2626" stroke-width="2"/>
  <text x="237" y="100" fill="#7f1d1d" font-size="12.5" font-weight="700" text-anchor="middle">Trap 1: Blindly Retrying Sold-Out Spec/</text>
  <text x="237" y="120" fill="#991b1b" font-size="11.5" font-weight="500" text-anchor="middle">Zone</text>
  <text x="237" y="140" fill="#991b1b" font-size="11.5" font-weight="500" text-anchor="middle">-&gt; Wastes Hundreds of CSP API Calls</text>
  <rect x="450" y="72" width="386" height="86" rx="8" fill="#fff5f5" stroke="#dc2626" stroke-width="2"/>
  <text x="643" y="100" fill="#7f1d1d" font-size="12.5" font-weight="700" text-anchor="middle">Trap 2: Naive Risk Blacklisting on Quota</text>
  <text x="643" y="120" fill="#991b1b" font-size="11.5" font-weight="500" text-anchor="middle">Error</text>
  <text x="643" y="140" fill="#991b1b" font-size="11.5" font-weight="500" text-anchor="middle">-&gt; Falsely Blocks Valid Spec After 500 VMs</text>
