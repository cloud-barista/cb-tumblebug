  <text x="237" y="280" fill="#14532d" font-size="12.5" font-weight="700" text-anchor="middle">Quota / Throttling Error -&gt; Relax Risk</text>
  <text x="237" y="300" fill="#166534" font-size="11.5" font-weight="500" text-anchor="middle">Penalty (Keep Spec Viable)</text>
  <rect x="450" y="252" width="386" height="66" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="643" y="280" fill="#14532d" font-size="12.5" font-weight="700" text-anchor="middle">Sold-Out / Invalid Spec -&gt; Write-Through</text>
  <text x="643" y="300" fill="#166534" font-size="11.5" font-weight="500" text-anchor="middle">Unavailable to PostgreSQL</text>
