  <text x="643" y="532" fill="#0f172a" font-size="12.5" font-weight="700" text-anchor="middle">OpenBao KV v2</text>
  <text x="643" y="552" fill="#334155" font-size="11.5" font-weight="500" text-anchor="middle">(RSA PrivateKey Offloaded)</text>
