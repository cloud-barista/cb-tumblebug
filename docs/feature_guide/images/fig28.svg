<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 534" width="100%" height="auto" style="text-size-adjust: none; -webkit-text-size-adjust: none;" font-family="'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-4%" width="104%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="4" y="4" width="872" height="526" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <rect x="20" y="22" width="840" height="482" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <line x1="430" y1="77" x2="446" y2="77" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
  <path d="M 643 114 L 643 130 L 237 130 L 237 146" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
  <line x1="430" y1="187" x2="446" y2="187" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
  <path d="M 643 224 L 643 240 L 237 240 L 237 256" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
  <line x1="643" y1="224" x2="643" y2="256" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
  <path d="M 643 354 L 643 370 L 440 370 L 440 386" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
  <path d="M 647 437 L 864 437 L 864 77 L 840 77" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
  <rect x="44" y="40" width="386" height="74" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="237" y="82" fill="#0f172a" font-size="12.5" font-weight="700" text-anchor="middle">Available (Healthy Shared Resource)</text>
  <rect x="450" y="40" width="386" height="74" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="643" y="67" fill="#475569" font-size="10.5" font-weight="700" text-anchor="middle">▸ Persist Tombstone</text>
  <line x1="466" y1="73" x2="820" y2="73" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="643" y="91" fill="#0f172a" font-size="12.5" font-weight="700" text-anchor="middle">Status = Deleting</text>
  <rect x="44" y="150" width="386" height="74" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="237" y="177" fill="#475569" font-size="10.5" font-weight="700" text-anchor="middle">▸ Call SP DELETE + 5x3s Wait Loop</text>
  <line x1="60" y1="183" x2="414" y2="183" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="237" y="201" fill="#0f172a" font-size="12.5" font-weight="700" text-anchor="middle">Tier 1: Single GET Poll Complete</text>
  <rect x="450" y="150" width="386" height="74" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="643" y="182" fill="#0f172a" font-size="12.5" font-weight="700" text-anchor="middle">Tier 2: Live CSP Presence</text>
  <text x="643" y="202" fill="#334155" font-size="11.5" font-weight="500" text-anchor="middle">(Check onCsp)?</text>
  <rect x="44" y="260" width="386" height="94" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="237" y="287" fill="#475569" font-size="10.5" font-weight="700" text-anchor="middle">▸ onCsp == false (Confirmed Absent)</text>
  <line x1="60" y1="293" x2="414" y2="293" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="237" y="311" fill="#14532d" font-size="12.5" font-weight="700" text-anchor="middle">Purge Local etcd Record</text>
  <text x="237" y="331" fill="#166534" font-size="11.5" font-weight="500" text-anchor="middle">(Zero Orphans)</text>
  <rect x="450" y="260" width="386" height="94" rx="8" fill="#fff5f5" stroke="#dc2626" stroke-width="2"/>
  <text x="643" y="287" fill="#475569" font-size="10.5" font-weight="700" text-anchor="middle">▸ onCsp == true (Still Alive on CSP)</text>
  <line x1="466" y1="293" x2="820" y2="293" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="643" y="311" fill="#7f1d1d" font-size="12.5" font-weight="700" text-anchor="middle">Status = Failed (Record Deletion Failure)</text>
  <text x="643" y="331" fill="#991b1b" font-size="11.5" font-weight="500" text-anchor="middle">Keep Tombstone &amp; Block Local Purge</text>
  <rect x="233" y="390" width="414" height="94" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="440" y="417" fill="#475569" font-size="10.5" font-weight="700" text-anchor="middle">▸ Retry Detects Missing SP IID + onCsp == true</text>
  <line x1="249" y1="423" x2="631" y2="423" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="440" y="441" fill="#1e3a8a" font-size="12.5" font-weight="700" text-anchor="middle">Dead-End IID Auto-Repair:</text>
  <text x="440" y="461" fill="#1e40af" font-size="11.5" font-weight="500" text-anchor="middle">Re-Register Stored SystemId into SP &amp; Retry DELETE</text>
