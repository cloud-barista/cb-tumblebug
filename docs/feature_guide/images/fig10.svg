  <text x="125" y="67" fill="#1e3a8a" font-size="11.5" font-weight="700" text-anchor="middle">NodeGroup Worker</text>
  <text x="125" y="85" fill="#1e3a8a" font-size="11.5" font-weight="700" text-anchor="middle">(Zone A)</text>
  <line x1="334" y1="110" x2="334" y2="424" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5,4"/>
  <rect x="237" y="32" width="195" height="78" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="334" y="67" fill="#1e3a8a" font-size="11.5" font-weight="700" text-anchor="middle">NodeGroup Worker</text>
  <text x="334" y="85" fill="#1e3a8a" font-size="11.5" font-weight="700" text-anchor="middle">(Zone B)</text>
  <line x1="543" y1="110" x2="543" y2="424" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5,4"/>
