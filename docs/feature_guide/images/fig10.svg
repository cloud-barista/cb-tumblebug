  <text x="543" y="308" fill="#92400e" font-size="11" font-weight="700" text-anchor="middle">Serialized per VNet to prevent CIDR collision</text>
  <line x1="543" y1="374" x2="748" y2="374" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="455" y="346" width="384" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="647" y="361" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">4. Allocate 10.x.2.0/24 &amp; Create Subnet in Zone B</text>
