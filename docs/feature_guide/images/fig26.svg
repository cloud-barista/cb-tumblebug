  <text x="150" y="117" fill="#475569" font-size="10.5" font-weight="700" text-anchor="middle">▸ Hazard 3: Direct SDK</text>
  <text x="150" y="135" fill="#475569" font-size="10.5" font-weight="700" text-anchor="middle">Deletes VM, SP IID Lingers</text>
  <line x1="55" y1="141" x2="245" y2="141" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="150" y="159" fill="#7c2d12" font-size="12.5" font-weight="700" text-anchor="middle">SP</text>
  <text x="150" y="179" fill="#9a3412" font-size="11.5" font-weight="500" text-anchor="middle">(PostgreSQL IID DB)</text>
  <rect x="329" y="72" width="222" height="148" rx="8" fill="#fff5f5" stroke="#dc2626" stroke-width="2"/>
  <text x="440" y="99" fill="#475569" font-size="10.5" font-weight="700" text-anchor="middle">▸ Hazard 1: Partial Create</text>
  <text x="440" y="117" fill="#475569" font-size="10.5" font-weight="700" text-anchor="middle">Failure (42/10,456)</text>
  <text x="440" y="135" fill="#475569" font-size="10.5" font-weight="700" text-anchor="middle">▸ Hazard 2: SP Drops IID,</text>
  <text x="440" y="153" fill="#475569" font-size="10.5" font-weight="700" text-anchor="middle">CSP Resource Survives</text>
