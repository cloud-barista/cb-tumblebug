  <text x="730" y="117" fill="#475569" font-size="10.5" font-weight="700" text-anchor="middle">▸ Hazard 4: Transient</text>
  <text x="730" y="135" fill="#475569" font-size="10.5" font-weight="700" text-anchor="middle">1-Cycle List Omission</text>
  <line x1="635" y1="141" x2="825" y2="141" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="730" y="159" fill="#1e3a8a" font-size="12.5" font-weight="700" text-anchor="middle">TB</text>
  <text x="730" y="179" fill="#1e40af" font-size="11.5" font-weight="500" text-anchor="middle">(etcd + Status Store)</text>
