  <text x="440" y="529" fill="#475569" font-size="10.5" font-weight="700" text-anchor="middle">▸ Reached Stable Suspended</text>
  <line x1="276" y1="535" x2="604" y2="535" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="440" y="553" fill="#0f172a" font-size="12.5" font-weight="700" text-anchor="middle">Low-Frequency Poll (10m)</text>
  <text x="440" y="573" fill="#334155" font-size="11.5" font-weight="500" text-anchor="middle">Steady Suspended State</text>
