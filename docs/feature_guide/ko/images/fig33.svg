  <rect x="260" y="580" width="360" height="64" rx="8" fill="#fff5f5" stroke="#dc2626" stroke-width="2"/>
  <text x="440" y="617" fill="#7f1d1d" font-size="12.5" font-weight="700" text-anchor="middle">25 GB+ RAM (OOM) &amp; 40분 이상 소요</text>
  <rect x="260" y="738" width="360" height="66" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="440" y="766" fill="#0f172a" font-size="12.5" font-weight="700" text-anchor="middle">VM 생성 요청</text>
  <text x="440" y="786" fill="#334155" font-size="11.5" font-weight="500" text-anchor="middle">(+ OS 타입 힌트)</text>
  <rect x="260" y="840" width="360" height="66" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="440" y="868" fill="#1e3a8a" font-size="12.5" font-weight="700" text-anchor="middle">50분 TTL 커넥션 캐시</text>
  <text x="440" y="888" fill="#1e40af" font-size="11.5" font-weight="500" text-anchor="middle">&amp; 공유 IAM 인증기</text>
  <rect x="260" y="942" width="360" height="66" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="440" y="970" fill="#0f172a" font-size="12.5" font-weight="700" text-anchor="middle">즉시 CSP VM 생성</text>
  <text x="440" y="990" fill="#334155" font-size="11.5" font-weight="500" text-anchor="middle">(사전 검사 0회, 적응형 1-3초 폴링)</text>
  <rect x="260" y="1044" width="360" height="66" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="440" y="1072" fill="#0f172a" font-size="12.5" font-weight="700" text-anchor="middle">생성 Poller 응답 재사용 (단 1회 조회)</text>
  <text x="440" y="1092" fill="#334155" font-size="11.5" font-weight="500" text-anchor="middle">+ PostgreSQL IID 기록</text>
  <rect x="260" y="1146" width="360" height="64" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="440" y="1183" fill="#14532d" font-size="12.5" font-weight="700" text-anchor="middle">피크 메모리 385-514 MiB (~98% 절감)</text>
