  <text x="440" y="200" fill="#0f172a" font-size="12.5" font-weight="700" text-anchor="middle">매 요청 클라우드 재인증</text>
  <text x="440" y="220" fill="#334155" font-size="11.5" font-weight="500" text-anchor="middle">(Azure 17개 클라이언트 / IBM 5회 왕복)</text>
  <rect x="260" y="274" width="360" height="66" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
