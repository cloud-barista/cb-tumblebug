  <text x="440" y="322" fill="#334155" font-size="11.5" font-weight="500" text-anchor="middle">전체 VM 목록 스캔 + Windows 이미지 조회</text>
  <rect x="260" y="376" width="360" height="66" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
