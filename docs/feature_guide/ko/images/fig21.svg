  <text x="440" y="868" fill="#0f172a" font-size="12.5" font-weight="700" text-anchor="middle">NHN: Floating IP 제어 중 TCP Reset/EOF 발생 시</text>
  <text x="440" y="888" fill="#334155" font-size="11.5" font-weight="500" text-anchor="middle">2s -&gt; 4s 지수 백오프 자동 재시도</text>
