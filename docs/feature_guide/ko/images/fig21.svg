  <text x="237" y="220" fill="#334155" font-size="11.5" font-weight="500" text-anchor="middle">온디맨드 서브넷 선별 생성</text>
  <rect x="450" y="172" width="386" height="66" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="643" y="200" fill="#0f172a" font-size="12.5" font-weight="700" text-anchor="middle">GCP: VPC 레벨 CIDR 생략</text>
  <text x="643" y="220" fill="#334155" font-size="11.5" font-weight="500" text-anchor="middle">(서브넷 레벨 CIDR만 전달)</text>
  <rect x="44" y="274" width="386" height="66" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="237" y="302" fill="#0f172a" font-size="12.5" font-weight="700" text-anchor="middle">IBM: VPC당 서브넷 1개로 제한</text>
  <text x="237" y="322" fill="#334155" font-size="11.5" font-weight="500" text-anchor="middle">(동일 Address Prefix 충돌 방지 + 3회 재시도)</text>
  <rect x="450" y="274" width="386" height="66" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="643" y="302" fill="#0f172a" font-size="12.5" font-weight="700" text-anchor="middle">NCP: 멀티존 비활성화 &amp; 단일 Zone 고정</text>
  <text x="643" y="322" fill="#334155" font-size="11.5" font-weight="500" text-anchor="middle">(VPC 내 모든 서브넷 동일 Zone 강제)</text>
  <rect x="241" y="376" width="399" height="66" rx="8" fill="#fffbeb" stroke="#ea580c" stroke-width="2"/>
  <text x="440" y="404" fill="#7c2d12" font-size="12.5" font-weight="700" text-anchor="middle">KT Cloud: 단일 VPC 409 중복 CIDR 감지 시</text>
  <text x="440" y="424" fill="#9a3412" font-size="11.5" font-weight="500" text-anchor="middle">10.{altIndex}.0.0/16 대역으로 최대 3회 자동 시프트!</text>
  <rect x="260" y="536" width="360" height="64" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="440" y="573" fill="#1e3a8a" font-size="12.5" font-weight="700" text-anchor="middle">VM 생성 / 등록 / 생명주기 제어</text>
  <rect x="44" y="636" width="386" height="66" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="237" y="664" fill="#0f172a" font-size="12.5" font-weight="700" text-anchor="middle">Alibaba &amp; Azure: 동적 최신 이미지 해석</text>
  <text x="237" y="684" fill="#334155" font-size="11.5" font-weight="500" text-anchor="middle">(이미지 패밀리 / 최신 URN 자동 변환)</text>
  <rect x="450" y="636" width="386" height="66" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="643" y="664" fill="#14532d" font-size="12.5" font-weight="700" text-anchor="middle">Azure: 완료 대기 없는 비동기 제어 개시</text>
  <text x="643" y="684" fill="#166534" font-size="11.5" font-weight="500" text-anchor="middle">&amp; 일반 Terminate는 NIC 정리용 SP 경로 유지</text>
  <rect x="44" y="738" width="386" height="66" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="237" y="766" fill="#0f172a" font-size="12.5" font-weight="700" text-anchor="middle">GCP: 등록 시 Placeholder SSHKey 자동 생성</text>
  <text x="237" y="786" fill="#334155" font-size="11.5" font-weight="500" text-anchor="middle">(독립 SSHKey 객체 부재 보정)</text>
  <rect x="450" y="738" width="386" height="66" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="643" y="776" fill="#0f172a" font-size="12.5" font-weight="700" text-anchor="middle">NCP: 제어 타임아웃 +10분 추가 연장</text>
