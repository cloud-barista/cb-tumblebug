  <text x="643" y="661" fill="#0f172a" font-size="12.5" font-weight="700" text-anchor="middle">Range Read + 50-워커 병렬</text>
  <text x="643" y="681" fill="#334155" font-size="11.5" font-weight="500" text-anchor="middle">블루프린트 합성 조립 -&gt; 1,588.81 ms</text>
