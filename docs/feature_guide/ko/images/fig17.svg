  <text x="237" y="671" fill="#14532d" font-size="12.5" font-weight="700" text-anchor="middle">캐시된 조립 완료 인프라 즉시 반환 -&gt; 370.11 ms</text>
  <rect x="450" y="610" width="386" height="94" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="643" y="637" fill="#475569" font-size="10.5" font-weight="700" text-anchor="middle">▸ Cold 미스</text>
