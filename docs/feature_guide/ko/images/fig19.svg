<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 676" width="100%" height="auto" style="text-size-adjust: none; -webkit-text-size-adjust: none;" font-family="'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-4%" width="104%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="4" y="4" width="872" height="668" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <rect x="20" y="22" width="840" height="338" rx="10" fill="#ffffff" stroke="#fecaca" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="20" y="22" width="840" height="36" rx="10" fill="#fef2f2"/>
  <rect x="20" y="46" width="840" height="12" fill="#fef2f2"/>
  <line x1="20" y1="58" x2="860" y2="58" stroke="#fecaca" stroke-width="1"/>
  <rect x="36" y="29" width="78" height="22" rx="5" fill="#dc2626"/>
  <text x="75" y="44" fill="#ffffff" font-size="10.5" font-weight="700" text-anchor="middle">문제점</text>
  <text x="126" y="45" fill="#991b1b" font-size="13" font-weight="700">문제점: 획일적 병렬성 및 단일 평면 세마포어의 한계</text>
  <rect x="20" y="384" width="840" height="258" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="20" y="384" width="840" height="36" rx="10" fill="#f0fdf4"/>
  <rect x="20" y="408" width="840" height="12" fill="#f0fdf4"/>
  <line x1="20" y1="420" x2="860" y2="420" stroke="#bbf7d0" stroke-width="1"/>
  <rect x="36" y="391" width="78" height="22" rx="5" fill="#16a34a"/>
  <text x="75" y="406" fill="#ffffff" font-size="10.5" font-weight="700" text-anchor="middle">해결책</text>
  <text x="126" y="407" fill="#166534" font-size="13" font-weight="700">해결책: 10종 CSP 맞춤형 적응형 엔진 + 슬롯 격리</text>
  <line x1="237" y1="136" x2="237" y2="168" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
  <path d="M 237 136 L 237 152 L 643 152 L 643 168" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
  <path d="M 643 136 L 643 203 L 237 203 L 237 270" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
  <line x1="643" y1="136" x2="643" y2="270" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
  <line x1="237" y1="238" x2="237" y2="430" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
  <line x1="643" y1="238" x2="643" y2="430" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
  <line x1="237" y1="340" x2="237" y2="552" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
  <line x1="643" y1="340" x2="643" y2="552" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
  <rect x="44" y="72" width="386" height="64" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="237" y="109" fill="#0f172a" font-size="12.5" font-weight="700" text-anchor="middle">획일적 동시성 (예: 모든 CSP 리전당 20대)</text>
  <rect x="450" y="72" width="386" height="64" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="643" y="109" fill="#0f172a" font-size="12.5" font-weight="700" text-anchor="middle">단일 공유 세마포어 풀</text>
  <rect x="44" y="172" width="386" height="66" rx="8" fill="#fff5f5" stroke="#dc2626" stroke-width="2"/>
  <text x="237" y="200" fill="#7f1d1d" font-size="12.5" font-weight="700" text-anchor="middle">Tencent (10 req/s 한도) &amp; NCP 제어 평면 즉시</text>
  <text x="237" y="220" fill="#991b1b" font-size="11.5" font-weight="500" text-anchor="middle">마비</text>
  <rect x="450" y="172" width="386" height="66" rx="8" fill="#fff5f5" stroke="#dc2626" stroke-width="2"/>
  <text x="643" y="200" fill="#7f1d1d" font-size="12.5" font-weight="700" text-anchor="middle">GCP VPC CIDR 거부 / NCP 멀티존 오류 / KT</text>
  <text x="643" y="220" fill="#991b1b" font-size="11.5" font-weight="500" text-anchor="middle">CIDR 409 충돌</text>
  <rect x="44" y="274" width="386" height="66" rx="8" fill="#fff5f5" stroke="#dc2626" stroke-width="2"/>
  <text x="237" y="302" fill="#7f1d1d" font-size="12.5" font-weight="700" text-anchor="middle">대기 중인 GCP Rate-Limit 워커가</text>
  <text x="237" y="322" fill="#991b1b" font-size="11.5" font-weight="500" text-anchor="middle">활성 생성 슬롯을 30초 이상 점유</text>
  <rect x="450" y="274" width="386" height="66" rx="8" fill="#fff5f5" stroke="#dc2626" stroke-width="2"/>
  <text x="643" y="302" fill="#7f1d1d" font-size="12.5" font-weight="700" text-anchor="middle">Resume 직후 수백 개의 IP 조회 워커가</text>
  <text x="643" y="322" fill="#991b1b" font-size="11.5" font-weight="500" text-anchor="middle">50개 SP 슬롯 독점 -&gt; 상태 폴링 마비!</text>
  <rect x="44" y="434" width="386" height="86" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="237" y="472" fill="#14532d" font-size="12.5" font-weight="700" text-anchor="middle">10종 CSP별 동시성 프로파일 &amp; 스태거링 지터</text>
  <text x="237" y="492" fill="#166534" font-size="11.5" font-weight="500" text-anchor="middle">+ 리전 조기 쿼터 취소 + 연관관계 일괄 병합 갱신</text>
  <rect x="450" y="434" width="386" height="86" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="643" y="462" fill="#14532d" font-size="12.5" font-weight="700" text-anchor="middle">CSP별 네트워크/수명주기 특화 보정 엔진</text>
  <text x="643" y="482" fill="#166534" font-size="11.5" font-weight="500" text-anchor="middle">(VPC 정책 자동 보정 / +10분 타임아웃 / CIDR 자동</text>
  <text x="643" y="502" fill="#166534" font-size="11.5" font-weight="500" text-anchor="middle">시프트)</text>
  <rect x="44" y="556" width="386" height="66" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="237" y="584" fill="#14532d" font-size="12.5" font-weight="700" text-anchor="middle">GCP 대기자는 활성 슬롯을 즉시 반납하고</text>
  <text x="237" y="604" fill="#166534" font-size="11.5" font-weight="500" text-anchor="middle">전용 쿼터 대기 슬롯(60개)으로 이동</text>
  <rect x="450" y="556" width="386" height="66" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="643" y="584" fill="#14532d" font-size="12.5" font-weight="700" text-anchor="middle">IP 조회는 전용 세마포어(15개)로 상한 제한</text>
  <text x="643" y="604" fill="#166534" font-size="11.5" font-weight="500" text-anchor="middle">-&gt; 최소 35/50 슬롯은 항상 상태/제어용으로 보장!</text>
</svg>
