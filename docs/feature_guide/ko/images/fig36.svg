  <text x="440" y="109" fill="#0f172a" font-size="12.5" font-weight="700" text-anchor="middle">단일 물리 호스트</text>
  <rect x="260" y="172" width="360" height="66" rx="8" fill="#fff5f5" stroke="#dc2626" stroke-width="2"/>
  <text x="440" y="200" fill="#7f1d1d" font-size="12.5" font-weight="700" text-anchor="middle">TB + SP + etcd + 2x Postgres가</text>
  <text x="440" y="220" fill="#991b1b" font-size="11.5" font-weight="500" text-anchor="middle">CPU, Go GC, 네트워크 소켓을 두고 경합</text>
  <rect x="38" y="332" width="368" height="92" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
