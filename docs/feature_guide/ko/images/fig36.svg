  <text x="75" y="44" fill="#ffffff" font-size="10.5" font-weight="700" text-anchor="middle">문제점</text>
  <text x="126" y="45" fill="#991b1b" font-size="13" font-weight="700">문제 A: 단일 호스트 리소스 경합</text>
  <rect x="20" y="282" width="840" height="162" rx="10" fill="#ffffff" stroke="#fecaca" stroke-width="1.5" filter="url(#shadow)"/>
