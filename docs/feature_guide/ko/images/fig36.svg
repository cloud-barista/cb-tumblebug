  <text x="75" y="304" fill="#ffffff" font-size="10.5" font-weight="700" text-anchor="middle">문제점</text>
  <text x="126" y="305" fill="#991b1b" font-size="13" font-weight="700">문제 B: 무작위 K8s 노드 분산</text>
