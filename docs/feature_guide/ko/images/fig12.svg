<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 352" width="100%" height="auto" style="text-size-adjust: none; -webkit-text-size-adjust: none;" font-family="'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-4%" width="104%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="4" y="4" width="872" height="344" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <rect x="20" y="22" width="840" height="136" rx="10" fill="#ffffff" stroke="#fecaca" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="20" y="22" width="840" height="36" rx="10" fill="#fef2f2"/>
  <rect x="20" y="46" width="840" height="12" fill="#fef2f2"/>
  <line x1="20" y1="58" x2="860" y2="58" stroke="#fecaca" stroke-width="1"/>
  <rect x="36" y="29" width="78" height="22" rx="5" fill="#dc2626"/>
  <text x="75" y="44" fill="#ffffff" font-size="10.5" font-weight="700" text-anchor="middle">문제점</text>
  <text x="126" y="45" fill="#991b1b" font-size="13" font-weight="700">문제점: 146개 리전에서의 양면 함정</text>
  <rect x="20" y="182" width="840" height="136" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="20" y="182" width="840" height="36" rx="10" fill="#f0fdf4"/>
  <rect x="20" y="206" width="840" height="12" fill="#f0fdf4"/>
  <line x1="20" y1="218" x2="860" y2="218" stroke="#bbf7d0" stroke-width="1"/>
  <rect x="36" y="189" width="78" height="22" rx="5" fill="#16a34a"/>
  <text x="75" y="204" fill="#ffffff" font-size="10.5" font-weight="700" text-anchor="middle">해결책</text>
  <text x="126" y="205" fill="#166534" font-size="13" font-weight="700">해결책: 쿼터 인지형 위험도 엔진 + 실시간 DB 즉시 반영</text>
  <path d="M 237 138 L 237 183 L 643 183 L 643 228" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
  <path d="M 643 138 L 643 183 L 237 183 L 237 228" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
  <rect x="44" y="72" width="386" height="66" rx="8" fill="#fff5f5" stroke="#dc2626" stroke-width="2"/>
  <text x="237" y="100" fill="#7f1d1d" font-size="12.5" font-weight="700" text-anchor="middle">함정 1: 품절된 스펙/존에 무작정 요청 전송</text>
  <text x="237" y="120" fill="#991b1b" font-size="11.5" font-weight="500" text-anchor="middle">-&gt; 수백 회의 CSP API 호출 및 시간 낭비</text>
  <rect x="450" y="72" width="386" height="66" rx="8" fill="#fff5f5" stroke="#dc2626" stroke-width="2"/>
  <text x="643" y="100" fill="#7f1d1d" font-size="12.5" font-weight="700" text-anchor="middle">함정 2: 쿼터 초과 에러를 스펙 결함으로 오판</text>
  <text x="643" y="120" fill="#991b1b" font-size="11.5" font-weight="500" text-anchor="middle">-&gt; 500대 생성 후 정상 스펙까지 부당 차단!</text>
  <rect x="44" y="232" width="386" height="66" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="237" y="260" fill="#14532d" font-size="12.5" font-weight="700" text-anchor="middle">쿼터 / 쓰로틀링 에러 -&gt; 위험도 페널티 완화</text>
  <text x="237" y="280" fill="#166534" font-size="11.5" font-weight="500" text-anchor="middle">(정상 스펙 유지)</text>
  <rect x="450" y="232" width="386" height="66" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="643" y="260" fill="#14532d" font-size="12.5" font-weight="700" text-anchor="middle">품절 / 미지원 스펙 -&gt; PostgreSQL 메타DB에</text>
  <text x="643" y="280" fill="#166534" font-size="11.5" font-weight="500" text-anchor="middle">즉시 비가용 마킹</text>
</svg>
