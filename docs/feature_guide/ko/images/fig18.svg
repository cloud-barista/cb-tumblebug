<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 458" width="100%" height="auto" style="text-size-adjust: none; -webkit-text-size-adjust: none;" font-family="'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-4%" width="104%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="4" y="4" width="872" height="450" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <rect x="20" y="22" width="840" height="406" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <line x1="440" y1="104" x2="440" y2="136" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
  <line x1="440" y1="204" x2="440" y2="236" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
  <line x1="440" y1="306" x2="440" y2="338" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
  <rect x="260" y="40" width="360" height="64" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="440" y="77" fill="#0f172a" font-size="12.5" font-weight="700" text-anchor="middle">반복적인 10,000-VM 생성/삭제 사이클</text>
  <rect x="260" y="140" width="360" height="64" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="440" y="177" fill="#0f172a" font-size="12.5" font-weight="700" text-anchor="middle">BoltDB 내 과거 MVCC 리비전 누적</text>
  <rect x="260" y="240" width="360" height="66" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="440" y="268" fill="#1e3a8a" font-size="12.5" font-weight="700" text-anchor="middle">1. MVCC 압축 (Compact)</text>
  <text x="440" y="288" fill="#1e40af" font-size="11.5" font-weight="500" text-anchor="middle">(내부적으로만 과거 리비전 재사용 표시)</text>
  <rect x="238" y="342" width="404" height="66" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="440" y="370" fill="#14532d" font-size="12.5" font-weight="700" text-anchor="middle">2. 디스크 조각 모음 (Defragment, 24시간 주기)</text>
  <text x="440" y="390" fill="#166534" font-size="11.5" font-weight="500" text-anchor="middle">(실제 디스크 파일 크기 축소 &amp; NOSPACE 원천 방지)</text>
