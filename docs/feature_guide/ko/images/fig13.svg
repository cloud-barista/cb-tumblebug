  <line x1="440" y1="206" x2="440" y2="238" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
  <line x1="440" y1="308" x2="440" y2="340" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
  <line x1="440" y1="410" x2="440" y2="442" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
  <path d="M 440 510 L 440 526 L 237 526 L 237 542" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
  <path d="M 440 510 L 440 526 L 643 526 L 643 542" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
  <path d="M 643 640 L 643 656 L 168 656 L 168 672" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
  <path d="M 643 640 L 643 656 L 440 656 L 440 672" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
  <path d="M 643 640 L 643 656 L 712 656 L 712 672" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
  <path d="M 712 790 L 712 806 L 440 806 L 440 822" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
  <rect x="260" y="40" width="360" height="64" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="440" y="77" fill="#0f172a" font-size="12.5" font-weight="700" text-anchor="middle">템플릿 / 동적 프로비저닝 요청</text>
  <rect x="239" y="140" width="402" height="66" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="440" y="168" fill="#0f172a" font-size="12.5" font-weight="700" text-anchor="middle">1. 온디맨드 스펙 등록 &amp; 동적 이미지 패밀리 해석</text>
  <text x="440" y="188" fill="#334155" font-size="11.5" font-weight="500" text-anchor="middle">(Alibaba 이미지 패밀리 / Azure 최신 URN)</text>
  <rect x="260" y="242" width="360" height="66" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="440" y="270" fill="#0f172a" font-size="12.5" font-weight="700" text-anchor="middle">2. Direct SDK 실시간 쿼터 &amp; 가용성 검증</text>
  <text x="440" y="290" fill="#334155" font-size="11.5" font-weight="500" text-anchor="middle">(실시간 vCPU 쿼터 잔량 + AZ 품절 오버레이)</text>
  <rect x="260" y="344" width="360" height="66" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="440" y="372" fill="#0f172a" font-size="12.5" font-weight="700" text-anchor="middle">3. 사전 위험도 분석 엔진</text>
  <text x="440" y="392" fill="#334155" font-size="11.5" font-weight="500" text-anchor="middle">(과거 스펙+이미지 조합 성공/실패 이력 평가)</text>
  <rect x="248" y="446" width="384" height="64" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="440" y="483" fill="#0f172a" font-size="12.5" font-weight="700" text-anchor="middle">4. 프로비저닝 실행 (비동기 실패 이벤트 로깅)</text>
  <rect x="44" y="546" width="386" height="94" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="237" y="583" fill="#475569" font-size="10.5" font-weight="700" text-anchor="middle">▸ 성공</text>
  <line x1="60" y1="589" x2="414" y2="589" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="237" y="607" fill="#0f172a" font-size="12.5" font-weight="700" text-anchor="middle">이력 저장소에 성공 기록</text>
  <rect x="450" y="546" width="386" height="94" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="643" y="573" fill="#475569" font-size="10.5" font-weight="700" text-anchor="middle">▸ 실패</text>
  <line x1="466" y1="579" x2="820" y2="579" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="643" y="597" fill="#0f172a" font-size="12.5" font-weight="700" text-anchor="middle">5. Direct CSP 에러 분석기 정밀 분류</text>
  <text x="643" y="617" fill="#334155" font-size="11.5" font-weight="500" text-anchor="middle">(대체 가용 영역 추출 &amp; 민감정보 마스킹)</text>
  <rect x="42" y="676" width="252" height="114" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="168" y="713" fill="#475569" font-size="10.5" font-weight="700" text-anchor="middle">▸ 계정 쿼터 초과 / 쓰로틀링</text>
  <line x1="58" y1="719" x2="278" y2="719" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="168" y="737" fill="#1e3a8a" font-size="12.5" font-weight="700" text-anchor="middle">위험도 페널티 완화</text>
  <text x="168" y="757" fill="#1e40af" font-size="11.5" font-weight="500" text-anchor="middle">(해당 스펙을 유효 상태로 유지)</text>
  <rect x="314" y="676" width="252" height="114" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="440" y="713" fill="#475569" font-size="10.5" font-weight="700" text-anchor="middle">▸ 특정 AZ 용량 품절</text>
  <line x1="330" y1="719" x2="550" y2="719" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="440" y="737" fill="#14532d" font-size="12.5" font-weight="700" text-anchor="middle">품절 캐시에 해당 AZ만 마킹</text>
  <text x="440" y="757" fill="#166534" font-size="11.5" font-weight="500" text-anchor="middle">(형제 AZ는 가용 상태 유지)</text>
  <rect x="586" y="676" width="252" height="114" rx="8" fill="#fffbeb" stroke="#ea580c" stroke-width="2"/>
  <text x="712" y="703" fill="#475569" font-size="10.5" font-weight="700" text-anchor="middle">▸ 미지원 스펙 / 이미지</text>
  <line x1="602" y1="709" x2="822" y2="709" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="712" y="727" fill="#7c2d12" font-size="12.5" font-weight="700" text-anchor="middle">PostgreSQL 메타DB 즉시</text>
  <text x="712" y="747" fill="#9a3412" font-size="11.5" font-weight="500" text-anchor="middle">반영</text>
  <text x="712" y="767" fill="#9a3412" font-size="11.5" font-weight="500" text-anchor="middle">비가용 스펙/이미지 및 존 능력 기록</text>
  <rect x="260" y="826" width="360" height="64" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="440" y="863" fill="#0f172a" font-size="12.5" font-weight="700" text-anchor="middle">후속 프로비저닝 및 추천에서 자동 배제</text>
</svg>
