<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 274" width="100%" height="auto" style="text-size-adjust: none; -webkit-text-size-adjust: none;" font-family="'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-4%" width="104%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="4" y="4" width="872" height="266" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <rect x="20" y="22" width="840" height="218" rx="10" fill="#ffffff" stroke="#fecaca" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="20" y="22" width="840" height="36" rx="10" fill="#fef2f2"/>
  <rect x="20" y="46" width="840" height="12" fill="#fef2f2"/>
  <line x1="20" y1="58" x2="860" y2="58" stroke="#fecaca" stroke-width="1"/>
  <rect x="36" y="29" width="78" height="22" rx="5" fill="#dc2626"/>
  <text x="75" y="44" fill="#ffffff" font-size="10.5" font-weight="700" text-anchor="middle">문제점</text>
  <text x="126" y="45" fill="#991b1b" font-size="13" font-weight="700">3자 간 상태 불일치 및 정합성 위험 요인</text>
  <line x1="619" y1="146" x2="555" y2="146" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
  <line x1="261" y1="146" x2="325" y2="146" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
  <line x1="619" y1="146" x2="265" y2="146" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
  <line x1="551" y1="146" x2="615" y2="146" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
  <rect x="39" y="72" width="222" height="148" rx="8" fill="#fffbeb" stroke="#ea580c" stroke-width="2"/>
  <text x="150" y="117" fill="#475569" font-size="10.5" font-weight="700" text-anchor="middle">▸ 위험 3: Direct SDK가 VM</text>
  <text x="150" y="135" fill="#475569" font-size="10.5" font-weight="700" text-anchor="middle">삭제 후 SP IID 잔류</text>
  <line x1="55" y1="141" x2="245" y2="141" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="150" y="159" fill="#7c2d12" font-size="12.5" font-weight="700" text-anchor="middle">SP</text>
  <text x="150" y="179" fill="#9a3412" font-size="11.5" font-weight="500" text-anchor="middle">(PostgreSQL IID DB)</text>
  <rect x="329" y="72" width="222" height="148" rx="8" fill="#fff5f5" stroke="#dc2626" stroke-width="2"/>
  <text x="440" y="99" fill="#475569" font-size="10.5" font-weight="700" text-anchor="middle">▸ 위험 1: 부분 생성 실패 (42/</text>
  <text x="440" y="117" fill="#475569" font-size="10.5" font-weight="700" text-anchor="middle">10,456)</text>
  <text x="440" y="135" fill="#475569" font-size="10.5" font-weight="700" text-anchor="middle">▸ 위험 2: SP만 IID 삭제, CSP</text>
