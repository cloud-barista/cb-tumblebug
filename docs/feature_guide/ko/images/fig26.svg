  <line x1="345" y1="159" x2="535" y2="159" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="440" y="177" fill="#7f1d1d" font-size="12.5" font-weight="700" text-anchor="middle">실제 클라우드 프로바이더</text>
  <text x="440" y="197" fill="#991b1b" font-size="11.5" font-weight="500" text-anchor="middle">(과금 중인 물리 리소스)</text>
  <rect x="619" y="72" width="222" height="148" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="730" y="117" fill="#475569" font-size="10.5" font-weight="700" text-anchor="middle">▸ 위험 4: 클라우드 목록 API의</text>
  <text x="730" y="135" fill="#475569" font-size="10.5" font-weight="700" text-anchor="middle">1주기 일시 누락</text>
  <line x1="635" y1="141" x2="825" y2="141" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="730" y="159" fill="#1e3a8a" font-size="12.5" font-weight="700" text-anchor="middle">TB</text>
  <text x="730" y="179" fill="#1e40af" font-size="11.5" font-weight="500" text-anchor="middle">(etcd + 상태 저장소)</text>
