  <text x="126" y="45" fill="#991b1b" font-size="13" font-weight="700">개선 전: 로컬 SQLite 파일 DB</text>
  <rect x="20" y="282" width="840" height="236" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.5" filter="url(#shadow)"/>
