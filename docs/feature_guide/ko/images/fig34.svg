  <text x="126" y="305" fill="#166534" font-size="13" font-weight="700">개선 후: 전용 PostgreSQL DB</text>
  <line x1="440" y1="136" x2="440" y2="168" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
