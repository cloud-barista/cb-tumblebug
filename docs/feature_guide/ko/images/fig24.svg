<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 602" width="100%" height="auto" style="text-size-adjust: none; -webkit-text-size-adjust: none;" font-family="'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-4%" width="104%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="4" y="4" width="872" height="594" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <rect x="20" y="20" width="840" height="568" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <line x1="125" y1="92" x2="125" y2="574" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5,4"/>
  <rect x="28" y="32" width="195" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="125" y="58" fill="#1e3a8a" font-size="11.5" font-weight="700" text-anchor="middle">HTTP 클라이언트 /</text>
  <text x="125" y="76" fill="#1e3a8a" font-size="11.5" font-weight="700" text-anchor="middle">게이트웨이</text>
  <line x1="334" y1="92" x2="334" y2="574" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5,4"/>
  <rect x="237" y="32" width="195" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="334" y="67" fill="#1e3a8a" font-size="11.5" font-weight="700" text-anchor="middle">TB 프로비저닝 엔진</text>
  <line x1="543" y1="92" x2="543" y2="574" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5,4"/>
  <rect x="446" y="32" width="195" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="543" y="67" fill="#1e3a8a" font-size="11.5" font-weight="700" text-anchor="middle">25분 인프라 작업 락</text>
  <line x1="752" y1="92" x2="752" y2="574" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5,4"/>
  <rect x="655" y="32" width="195" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="752" y="67" fill="#1e3a8a" font-size="11.5" font-weight="700" text-anchor="middle">SP / CSP</text>
  <line x1="125" y1="132" x2="330" y2="132" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="112" y="104" width="235" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="229" y="119" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">1. POST /infra (10,456 VMs)</text>
  <rect x="97" y="158" width="265" height="32" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="229" y="178" fill="#92400e" font-size="11" font-weight="700" text-anchor="middle">게이트웨이 요청 타임아웃 해제 (0s)</text>
  <line x1="334" y1="244" x2="539" y2="244" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="248" y="216" width="380" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="438" y="231" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">2. 25분 작업 락 획득 (폴러의 중간 상태 덮어쓰기 차단)</text>
  <path d="M 334 290 L 370 290 L 370 308 L 338 308" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="171" y="272" width="367" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="354" y="287" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">3. HTTP 요청 취소와 분리된 독립 실행 컨텍스트 생성</text>
  <line x1="125" y1="356" x2="330" y2="356" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-red)"/>
  <rect x="50" y="328" width="358" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="229" y="343" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">4. 클라이언트 타임아웃 / 연결 종료 (발생하더라도)</text>
  <rect x="349" y="382" width="388" height="32" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="543" y="402" fill="#92400e" font-size="11" font-weight="700" text-anchor="middle">분리된 컨텍스트는 취소되지 않고 끝까지 안전하게 실행!</text>
  <line x1="334" y1="468" x2="748" y2="468" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="341" y="440" width="405" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="543" y="455" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">5. 진행 중인 모든 VM 생성 완수 및 etcd에 식별자 정상 기록</text>
  <line x1="334" y1="524" x2="539" y2="524" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="373" y="496" width="131" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="438" y="511" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">6. 작업 락 해제</text>
</svg>
