  <line x1="271" y1="262" x2="434" y2="262" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="193" y="234" width="323" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="354" y="249" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">2. 리전당 단 1회 배치 호출 (최대 1,000 IDs)</text>
