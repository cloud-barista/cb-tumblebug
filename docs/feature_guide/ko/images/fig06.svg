  <rect x="361" y="290" width="321" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="521" y="305" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">3. 응답 내 모든 인스턴스의 공인 IP 일괄 저장</text>
  <line x1="438" y1="374" x2="275" y2="374" stroke="#16a34a" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-green)"/>
  <rect x="224" y="346" width="261" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="354" y="361" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">4. 인스턴스별 Running 상태 맵 반환</text>
  <line x1="271" y1="430" x2="108" y2="430" stroke="#16a34a" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-green)"/>
  <rect x="99" y="402" width="176" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="187" y="417" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">5. 배치 상태 결과 전달</text>
  <line x1="104" y1="486" x2="601" y2="486" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="219" y="458" width="271" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="354" y="473" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">6. 해당 인스턴스의 신규 공인 IP 조회</text>
  <line x1="605" y1="542" x2="108" y2="542" stroke="#16a34a" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-green)"/>
  <rect x="228" y="514" width="253" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="354" y="529" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">7. 메모리 즉시 히트 (SP 호출 0회)</text>
  <line x1="104" y1="598" x2="768" y2="598" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="253" y="570" width="371" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="438" y="585" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">8. Running 상태 + 공인 IP 동시 영속화 (+0.0s 지연)</text>
</svg>
