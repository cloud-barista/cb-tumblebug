  <text x="605" y="67" fill="#1e3a8a" font-size="11.5" font-weight="700" text-anchor="middle">독립 공인 IP 캐시</text>
  <text x="605" y="85" fill="#1e3a8a" font-size="11.5" font-weight="700" text-anchor="middle">(인메모리)</text>
  <line x1="772" y1="110" x2="772" y2="648" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5,4"/>
