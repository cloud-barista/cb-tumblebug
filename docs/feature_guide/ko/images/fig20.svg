  <rect x="230" y="40" width="420" height="66" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="440" y="68" fill="#1e3a8a" font-size="12.5" font-weight="700" text-anchor="middle">10,456-Node 글로벌 프로비저닝 오케스트레이터</text>
  <text x="440" y="88" fill="#1e40af" font-size="11.5" font-weight="500" text-anchor="middle">(Level 1: 10개 CSP 완전 독립 실행 트리 + 0~5s 런치 지터)</text>
  <rect x="44" y="196" width="386" height="106" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="237" y="224" fill="#0f172a" font-size="12.5" font-weight="700" text-anchor="middle">1. AWS</text>
  <text x="237" y="244" fill="#334155" font-size="11.5" font-weight="500" text-anchor="middle">• 생성: 30 리전 × 20 노드</text>
  <text x="237" y="264" fill="#334155" font-size="11.5" font-weight="500" text-anchor="middle">• 상태: 10 리전 × 30 노드 (1,000 ID 배치)</text>
  <text x="237" y="284" fill="#334155" font-size="11.5" font-weight="500" text-anchor="middle">• 스펙 가용 AZ 필터링 + 무지연 공인 IP 캐시</text>
  <rect x="450" y="196" width="386" height="106" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="643" y="224" fill="#0f172a" font-size="12.5" font-weight="700" text-anchor="middle">2. GCP</text>
  <text x="643" y="244" fill="#334155" font-size="11.5" font-weight="500" text-anchor="middle">• 생성: 30 리전 × 20 노드 + 쿼터 대기 슬롯(60)</text>
  <text x="643" y="264" fill="#334155" font-size="11.5" font-weight="500" text-anchor="middle">• 상태: 12 리전 × 35 노드 (프로젝트 집계 1회)</text>
  <text x="643" y="284" fill="#334155" font-size="11.5" font-weight="500" text-anchor="middle">• 빈 VPC CIDR + Placeholder SSHKey</text>
  <rect x="44" y="338" width="386" height="106" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="237" y="366" fill="#0f172a" font-size="12.5" font-weight="700" text-anchor="middle">3. Azure</text>
  <text x="237" y="386" fill="#334155" font-size="11.5" font-weight="500" text-anchor="middle">• 생성: 30 리전 × 20 노드 (독립 HTTP/2 Transport)</text>
  <text x="237" y="406" fill="#334155" font-size="11.5" font-weight="500" text-anchor="middle">• 상태: 8 리전 × 25 노드 (구독 스트림 조회)</text>
  <text x="237" y="426" fill="#334155" font-size="11.5" font-weight="500" text-anchor="middle">• 완료 대기 없는 비동기 제어 + 최신 URN 해석</text>
  <rect x="450" y="338" width="386" height="106" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="643" y="366" fill="#0f172a" font-size="12.5" font-weight="700" text-anchor="middle">4. Alibaba</text>
  <text x="643" y="386" fill="#334155" font-size="11.5" font-weight="500" text-anchor="middle">• 생성: 30 리전 × 20 노드</text>
  <text x="643" y="406" fill="#334155" font-size="11.5" font-weight="500" text-anchor="middle">• 상태: 6 리전 × 20 노드 (100 ID/페이지)</text>
  <text x="643" y="426" fill="#334155" font-size="11.5" font-weight="500" text-anchor="middle">• 동적 이미지 패밀리 해석 (10m Singleflight)</text>
  <rect x="44" y="538" width="386" height="106" rx="8" fill="#fffbeb" stroke="#ea580c" stroke-width="2"/>
  <text x="237" y="566" fill="#7c2d12" font-size="12.5" font-weight="700" text-anchor="middle">5. Tencent Cloud</text>
  <text x="237" y="586" fill="#9a3412" font-size="11.5" font-weight="500" text-anchor="middle">• 생성: 30 리전 × 5 노드 (초당 10 req 한도 대응!)</text>
  <text x="237" y="606" fill="#9a3412" font-size="11.5" font-weight="500" text-anchor="middle">• 상태: 6 리전 × 20 노드</text>
  <text x="237" y="626" fill="#9a3412" font-size="11.5" font-weight="500" text-anchor="middle">• 등록: 2 커넥션 (2,000~5,000ms 스태거링)</text>
  <rect x="450" y="538" width="386" height="106" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="643" y="566" fill="#0f172a" font-size="12.5" font-weight="700" text-anchor="middle">6. IBM Cloud</text>
  <text x="643" y="586" fill="#334155" font-size="11.5" font-weight="500" text-anchor="middle">• 생성: 30 리전 × 20 노드</text>
  <text x="643" y="606" fill="#334155" font-size="11.5" font-weight="500" text-anchor="middle">• 상태: 10 리전 × 30 노드</text>
  <text x="643" y="626" fill="#334155" font-size="11.5" font-weight="500" text-anchor="middle">• VPC당 단일 서브넷 캡 + 공유 IAM + 3회 재시도</text>
  <rect x="254" y="680" width="372" height="106" rx="8" fill="#fffbeb" stroke="#ea580c" stroke-width="2"/>
  <text x="440" y="708" fill="#7c2d12" font-size="12.5" font-weight="700" text-anchor="middle">7. NCP (Naver Cloud)</text>
  <text x="440" y="728" fill="#9a3412" font-size="11.5" font-weight="500" text-anchor="middle">• 생성: 5 리전 × 15 노드 (제어 평면 보호)</text>
  <text x="440" y="748" fill="#9a3412" font-size="11.5" font-weight="500" text-anchor="middle">• 상태: 3 리전 × 15 노드</text>
  <text x="440" y="768" fill="#9a3412" font-size="11.5" font-weight="500" text-anchor="middle">• 단일 존 고정 + 제어 타임아웃 +10분 + 로컬 RSA 키</text>
  <rect x="44" y="880" width="386" height="106" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="237" y="908" fill="#0f172a" font-size="12.5" font-weight="700" text-anchor="middle">8. NHN Cloud</text>
  <text x="237" y="928" fill="#334155" font-size="11.5" font-weight="500" text-anchor="middle">• 생성: 30 리전 × 20 노드</text>
  <text x="237" y="948" fill="#334155" font-size="11.5" font-weight="500" text-anchor="middle">• 상태: 5 리전 × 20 노드</text>
  <text x="237" y="968" fill="#334155" font-size="11.5" font-weight="500" text-anchor="middle">• Floating IP TCP Reset 2회 지수 백오프 재시도</text>
  <rect x="450" y="880" width="386" height="106" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="643" y="908" fill="#0f172a" font-size="12.5" font-weight="700" text-anchor="middle">9. KT Cloud</text>
  <text x="643" y="928" fill="#334155" font-size="11.5" font-weight="500" text-anchor="middle">• 생성: 30 리전 × 20 노드</text>
  <text x="643" y="948" fill="#334155" font-size="11.5" font-weight="500" text-anchor="middle">• 상태: 10 리전 × 30 노드</text>
  <text x="643" y="968" fill="#334155" font-size="11.5" font-weight="500" text-anchor="middle">• 단일 VPC 409 중복 CIDR 감지 시 /16 대역 자동 시프트</text>
  <rect x="251" y="1022" width="378" height="106" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="440" y="1050" fill="#0f172a" font-size="12.5" font-weight="700" text-anchor="middle">10. OpenStack (및 파생 클라우드)</text>
  <text x="440" y="1070" fill="#334155" font-size="11.5" font-weight="500" text-anchor="middle">• 생성: 30 리전 × 20 노드 (파생 클라우드 자동 통합)</text>
  <text x="440" y="1090" fill="#334155" font-size="11.5" font-weight="500" text-anchor="middle">• 상태: 5 리전 × 15 노드 (Direct Nova 배치)</text>
  <text x="440" y="1110" fill="#334155" font-size="11.5" font-weight="500" text-anchor="middle">• 50분 Keystone 토큰 캐시 &amp; 포트 필터</text>
  <rect x="260" y="1190" width="360" height="66" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="440" y="1218" fill="#14532d" font-size="12.5" font-weight="700" text-anchor="middle">리전 조기 쿼터 취소 (대기열 즉시 정리)</text>
  <text x="440" y="1238" fill="#166534" font-size="11.5" font-weight="500" text-anchor="middle">+ 완료 후 공유 리소스 연관관계 일괄 병합 기록</text>
</svg>
