  <text x="76" y="168" fill="#ffffff" font-size="10.5" font-weight="700" text-anchor="middle">아키텍처</text>
  <text x="128" y="169" fill="#1e40af" font-size="13" font-weight="700">Tier A: 초고속 벌크 &amp; 글로벌 클라우드 (리전 30 × 노드 20)</text>
  <rect x="20" y="488" width="840" height="318" rx="10" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="20" y="488" width="840" height="36" rx="10" fill="#fff7ed"/>
  <rect x="20" y="512" width="840" height="12" fill="#fff7ed"/>
  <line x1="20" y1="524" x2="860" y2="524" stroke="#fed7aa" stroke-width="1"/>
  <rect x="36" y="495" width="84" height="22" rx="5" fill="#ea580c"/>
  <text x="78" y="510" fill="#ffffff" font-size="10.5" font-weight="700" text-anchor="middle">보호 계층</text>
  <text x="132" y="511" fill="#9a3412" font-size="13" font-weight="700">Tier B: 엄격한 API Rate-Limit &amp; 엔터프라이즈 클라우드</text>
  <rect x="20" y="830" width="840" height="318" rx="10" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="20" y="830" width="840" height="36" rx="10" fill="#eff6ff"/>
  <rect x="20" y="854" width="840" height="12" fill="#eff6ff"/>
  <line x1="20" y1="866" x2="860" y2="866" stroke="#bfdbfe" stroke-width="1"/>
  <rect x="36" y="837" width="80" height="22" rx="5" fill="#2563eb"/>
  <text x="76" y="852" fill="#ffffff" font-size="10.5" font-weight="700" text-anchor="middle">아키텍처</text>
  <text x="128" y="853" fill="#1e40af" font-size="13" font-weight="700">Tier C: 리전 특화 &amp; 프라이빗/파생 클라우드</text>
  <rect x="20" y="1172" width="840" height="104" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <path d="M 440 106 L 440 149 L 237 149 L 237 192" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
  <path d="M 440 106 L 440 149 L 643 149 L 643 192" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
