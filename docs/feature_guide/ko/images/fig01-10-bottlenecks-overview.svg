<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 888" width="100%" height="auto" style="text-size-adjust: none; -webkit-text-size-adjust: none;" font-family="'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-4%" width="104%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Outer Canvas Card -->
  <rect x="4" y="4" width="872" height="880" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>


  <!-- ===================================================================== -->
  <!-- PART I: External Cloud API & Quota Bottlenecks (3 cards -> 262px each)-->
  <!-- ===================================================================== -->
  <rect x="20" y="24" width="840" height="184" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="20" y="24" width="840" height="36" rx="10" fill="#fef2f2"/>
  <rect x="20" y="48" width="840" height="12" fill="#fef2f2"/>
  <line x1="20" y1="60" x2="860" y2="60" stroke="#fecaca" stroke-width="1"/>
  <rect x="36" y="31" width="76" height="22" rx="5" fill="#dc2626"/>
  <text x="74" y="46" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">PART I</text>
  <text x="124" y="47" fill="#991b1b" font-size="13" font-weight="700">외부 클라우드 API 및 리소스 쿼터 병목</text>

  <!-- Card C1 (x=36, w=256, h=120): Badge stacked above Title so full 256px width is available! -->
  <rect x="36" y="72" width="256" height="122" rx="8" fill="#fff5f5" stroke="#dc2626" stroke-width="2"/>
  <rect x="52" y="84" width="66" height="20" rx="4" fill="#fee2e2"/>
  <text x="85" y="98" fill="#b91c1c" font-size="11" font-weight="700" text-anchor="middle">병목 1</text>
  <text x="52" y="124" fill="#7f1d1d" font-size="13" font-weight="700">CSP API 호출 폭증</text>
  <text x="52" y="148" fill="#991b1b" font-size="11.5">• 동기식 개별 호출로 429 발생</text>
  <text x="52" y="168" fill="#991b1b" font-size="11.5">• 중복 조회로 40,000+ 호출 폭풍</text>

  <!-- Card C2 (x=312, w=256, h=122) -->
  <rect x="312" y="72" width="256" height="122" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="328" y="84" width="66" height="20" rx="4" fill="#f1f5f9"/>
  <text x="361" y="98" fill="#334155" font-size="11" font-weight="700" text-anchor="middle">병목 2</text>
  <text x="328" y="124" fill="#0f172a" font-size="13" font-weight="700">리소스 쿼터 및 멀티존 대역</text>
  <text x="328" y="148" fill="#475569" font-size="11.5">• VPC(5개), 서브넷, 키 상한 도달</text>
  <text x="328" y="168" fill="#475569" font-size="11.5">• 다중 가용 영역 CIDR 대역 충돌</text>

  <!-- Card C3 (x=588, w=256, h=122) -->
  <rect x="588" y="72" width="256" height="122" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="604" y="84" width="66" height="20" rx="4" fill="#f1f5f9"/>
  <text x="637" y="98" fill="#334155" font-size="11" font-weight="700" text-anchor="middle">병목 3</text>
  <text x="604" y="124" fill="#0f172a" font-size="13" font-weight="700">146개 리전 스펙 불확실성</text>
  <text x="604" y="148" fill="#475569" font-size="11.5">• 리전별 품절 및 이미지 비호환</text>
  <text x="604" y="168" fill="#475569" font-size="11.5">• 대규모 배포 실험 재현성 부족</text>

  <!-- ===================================================================== -->
  <!-- PART II: Internal Core Engine Bottlenecks                             -->
  <!-- ===================================================================== -->
  <rect x="20" y="238" width="840" height="184" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="20" y="238" width="840" height="36" rx="10" fill="#fff7ed"/>
  <rect x="20" y="262" width="840" height="12" fill="#fff7ed"/>
  <line x1="20" y1="274" x2="860" y2="274" stroke="#fed7aa" stroke-width="1"/>
  <rect x="36" y="245" width="76" height="22" rx="5" fill="#ea580c"/>
  <text x="74" y="260" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">PART II</text>
  <text x="124" y="261" fill="#9a3412" font-size="13" font-weight="700">내부 코어 엔진 (저장소, 동시성, 생명주기) 병목</text>

  <!-- Card C4 (x=36, w=256, h=122) -->
  <rect x="36" y="286" width="256" height="122" rx="8" fill="#fffbeb" stroke="#ea580c" stroke-width="2"/>
  <rect x="52" y="298" width="66" height="20" rx="4" fill="#ffedd5"/>
  <text x="85" y="312" fill="#c2410c" font-size="11" font-weight="700" text-anchor="middle">병목 4</text>
  <text x="52" y="338" fill="#7c2d12" font-size="13" font-weight="700">etcd 부하 및 용량 고갈</text>
  <text x="52" y="362" fill="#9a3412" font-size="11.5">• 중복 데이터로 페이로드 120MB+</text>
  <text x="52" y="382" fill="#9a3412" font-size="11.5">• 잦은 상태 기록으로 디스크 고갈</text>

  <!-- Card C5 (x=312, w=256, h=122) -->
  <rect x="312" y="286" width="256" height="122" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="328" y="298" width="66" height="20" rx="4" fill="#f1f5f9"/>
  <text x="361" y="312" fill="#334155" font-size="11" font-weight="700" text-anchor="middle">병목 5</text>
  <text x="328" y="338" fill="#0f172a" font-size="13" font-weight="700">단순 병렬성과 슬롯 기아</text>
  <text x="328" y="362" fill="#475569" font-size="11.5">• 10개 CSP별 API 한도/특성 충돌</text>
  <text x="328" y="382" fill="#475569" font-size="11.5">• 장기 대기 작업의 워커 슬롯 독점</text>

  <!-- Card C6 (x=588, w=256, h=122) -->
  <rect x="588" y="286" width="256" height="122" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="604" y="298" width="66" height="20" rx="4" fill="#f1f5f9"/>
  <text x="637" y="312" fill="#334155" font-size="11" font-weight="700" text-anchor="middle">병목 6</text>
  <text x="604" y="338" fill="#0f172a" font-size="13" font-weight="700">장시간 작업과 타임아웃</text>
  <text x="604" y="362" fill="#475569" font-size="11.5">• 연결 종료 시 미완성 고아 VM 발생</text>
  <text x="604" y="382" fill="#475569" font-size="11.5">• 부팅 직후 원격 명령 시 SSH 거부</text>

  <!-- ===================================================================== -->
  <!-- PART III: Cross-Layer Consistency & Underlying Driver Bottlenecks     -->
  <!-- ===================================================================== -->
  <rect x="20" y="452" width="840" height="184" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="20" y="452" width="840" height="36" rx="10" fill="#eff6ff"/>
  <rect x="20" y="476" width="840" height="12" fill="#eff6ff"/>
  <line x1="20" y1="488" x2="860" y2="488" stroke="#bfdbfe" stroke-width="1"/>
  <rect x="36" y="459" width="92" height="22" rx="5" fill="#2563eb"/>
  <text x="82" y="474" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">PART III</text>
  <text x="140" y="475" fill="#1e40af" font-size="13" font-weight="700">계층 간 정합성 보정 및 하위 프레임워크 병목</text>

  <!-- Card C7 (x=36, w=394, h=122) -->
  <rect x="36" y="500" width="394" height="122" rx="8" fill="#f0f7ff" stroke="#2563eb" stroke-width="2"/>
  <rect x="52" y="512" width="66" height="20" rx="4" fill="#dbeafe"/>
  <text x="85" y="526" fill="#1d4ed8" font-size="11" font-weight="700" text-anchor="middle">병목 7</text>
  <text x="52" y="552" fill="#1e3a8a" font-size="13" font-weight="700">부분 실패 및 TB-SP-CSP 3자 정합성 붕괴</text>
  <text x="52" y="576" fill="#1e40af" font-size="11.5">• 일부 노드 실패 시 전체 배포 무산 또는 고아 리소스 잔류</text>
  <text x="52" y="596" fill="#1e40af" font-size="11.5">• 고아 VM이 공유 네트워크를 점유해 삭제 거부 유발</text>

  <!-- Card C8 (x=450, w=394, h=122) -->
  <rect x="450" y="500" width="394" height="122" rx="8" fill="#f0f7ff" stroke="#2563eb" stroke-width="2"/>
  <rect x="466" y="512" width="66" height="20" rx="4" fill="#dbeafe"/>
  <text x="499" y="526" fill="#1d4ed8" font-size="11" font-weight="700" text-anchor="middle">병목 8</text>
  <text x="466" y="552" fill="#1e3a8a" font-size="13" font-weight="700">SP 25 GB+ OOM 및 드라이버 중복 호출</text>
  <text x="466" y="576" fill="#1e40af" font-size="11.5">• 동기식 SSH 폴링 및 이력 고루틴 누적으로 OOM 발생</text>
  <text x="466" y="596" fill="#1e40af" font-size="11.5">• SQLite 잠금 경합 및 드라이버 내 수만 회 중복 조회</text>

  <!-- ===================================================================== -->
  <!-- PART IV: Cluster Compute Isolation & Observability Bottlenecks        -->
  <!-- ===================================================================== -->
  <rect x="20" y="666" width="840" height="184" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="20" y="666" width="840" height="36" rx="10" fill="#f0fdf4"/>
  <rect x="20" y="690" width="840" height="12" fill="#f0fdf4"/>
  <line x1="20" y1="702" x2="860" y2="702" stroke="#bbf7d0" stroke-width="1"/>
  <rect x="36" y="673" width="82" height="22" rx="5" fill="#16a34a"/>
  <text x="77" y="688" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">PART IV</text>
  <text x="130" y="689" fill="#166534" font-size="13" font-weight="700">클러스터 연산 분리 및 실시간 가시성 병목</text>

  <!-- Card C9 (x=36, w=394, h=122) -->
  <rect x="36" y="714" width="394" height="122" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="52" y="726" width="66" height="20" rx="4" fill="#f1f5f9"/>
  <text x="85" y="740" fill="#334155" font-size="11" font-weight="700" text-anchor="middle">병목 9</text>
  <text x="52" y="766" fill="#0f172a" font-size="13" font-weight="700">단일 호스트 한계 및 프로세스 간 간섭</text>
  <text x="52" y="790" fill="#475569" font-size="11.5">• 단일 노드 동시 실행 시 CPU/GC 스파이크 및 소켓 경합</text>
  <text x="52" y="810" fill="#475569" font-size="11.5">• K8s 노드 밀착(TB+DB) 및 분리(TB≠SP) 배치로 해결</text>

  <!-- Card C10 (x=450, w=394, h=122) -->
  <rect x="450" y="714" width="394" height="122" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <rect x="466" y="726" width="72" height="20" rx="4" fill="#dcfce7"/>
  <text x="502" y="740" fill="#15803d" font-size="11" font-weight="700" text-anchor="middle">병목 10</text>
  <text x="466" y="766" fill="#14532d" font-size="13" font-weight="700">10,000대 동시 실행 중 블랙박스 현상</text>
  <text x="466" y="790" fill="#166534" font-size="11.5">• 지연 원인이 DB 병목인지 CSP 쓰로틀링인지 식별 불가</text>
  <text x="466" y="810" fill="#166534" font-size="11.5">• 3계층 통합 로그 및 실시간 상관분석 대시보드로 해결</text>

  <!-- ===================================================================== -->
  <!-- Causal Connector Arrows Between Layers                                -->
  <!-- ===================================================================== -->
  <!-- C1 -> C4 -->
  <line x1="164" y1="194" x2="164" y2="280" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <!-- C2 -> C5 -->
  <line x1="440" y1="194" x2="440" y2="280" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-slate)"/>
  <!-- C3 -> C6 -->
  <line x1="716" y1="194" x2="716" y2="280" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-slate)"/>

  <!-- C4 -> C7 -->
  <line x1="164" y1="408" x2="164" y2="494" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <!-- C6 -> C7 -->
  <path d="M 716 408 L 716 432 L 310 432 L 310 494" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrow-slate)"/>
  <!-- C5 -> C8 -->
  <path d="M 440 408 L 440 432 L 647 432 L 647 494" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- C7 -> C9 -->
  <line x1="233" y1="622" x2="233" y2="708" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-slate)"/>
  <!-- C8 -> C10 -->
  <line x1="647" y1="622" x2="647" y2="708" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
</svg>
